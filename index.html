<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>彩票模拟器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 顶部标题栏：通过 flex 布局将版本号放置在同排右侧空白区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            background-color: #ffffff;
            border-bottom: 1px solid #eef0f2;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .header .version-tag {
            font-size: 13px;
            color: #666666;
            background-color: #f0f2f5;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 500;
        }

        .main-content {
            padding: 24px;
        }

        .display-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 24px 0;
        }

        .ball {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            box-shadow: inset -2px -2px 4px rgba(0, 0, 0, 0.2);
        }

        .ball-red {
            background: radial-gradient(circle at 30% 30%, #ff6b6b, #e03131);
        }

        .ball-blue {
            background: radial-gradient(circle at 30% 30%, #4dabf7, #1971c2);
        }

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            padding: 10px 24px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #228be6;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1c7ed6;
        }

        .btn-secondary {
            background-color: #e9ecef;
            color: #495057;
        }

        .btn-secondary:hover {
            background-color: #dee2e6;
        }

        .history-section {
            margin-top: 28px;
            border-top: 1px solid #eef0f2;
            padding-top: 16px;
        }

        .history-title {
            font-size: 14px;
            color: #868e96;
            margin-bottom: 12px;
        }

        .history-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
        }

        .history-item {
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px dashed #f1f3f5;
            color: #495057;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部栏：同排右侧包含版本号 -->
    <div class="header">
        <h1>彩票模拟器</h1>
        <span class="version-tag">《0.6开发者预览版》</span>
    </div>

    <div class="main-content">
        <p style="text-align: center; color: #666; font-size: 14px;">双色球摇号模拟（6红球 + 1蓝球）</p>
        
        <!-- 号码展示区 -->
        <div class="display-area" id="ballContainer">
            <div class="ball ball-red">?</div>
            <div class="ball ball-red">?</div>
            <div class="ball ball-red">?</div>
            <div class="ball ball-red">?</div>
            <div class="ball ball-red">?</div>
            <div class="ball ball-red">?</div>
            <div class="ball ball-blue">?</div>
        </div>

        <!-- 操作按钮 -->
        <div class="actions">
            <button class="btn-primary" onclick="drawLottery()">随机摇号</button>
            <button class="btn-secondary" onclick="clearHistory()">清空记录</button>
        </div>

        <!-- 历史记录 -->
        <div class="history-section">
            <div class="history-title">最近开奖记录</div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>
</div>

<script>
    function drawLottery() {
        // 生成 6 个不重复的红球 (1-33)
        const redBalls = [];
        while (redBalls.length < 6) {
            const num = Math.floor(Math.random() * 33) + 1;
            const formattedNum = num < 10 ? '0' + num : '' + num;
            if (!redBalls.includes(formattedNum)) {
                redBalls.push(formattedNum);
            }
        }
        redBalls.sort((a, b) => a - b);

        // 生成 1 个蓝球 (1-16)
        const blueNum = Math.floor(Math.random() * 16) + 1;
        const blueBall = blueNum < 10 ? '0' + blueNum : '' + blueNum;

        // 渲染球体界面
        const container = document.getElementById('ballContainer');
        container.innerHTML = '';

        redBalls.forEach(num => {
            const ball = document.createElement('div');
            ball.className = 'ball ball-red';
            ball.textContent = num;
            container.appendChild(ball);
        });

        const bBall = document.createElement('div');
        bBall.className = 'ball ball-blue';
        bBall.textContent = blueBall;
        container.appendChild(bBall);

        // 添加到历史记录
        addHistory(redBalls, blueBall);
    }

    function addHistory(reds, blue) {
        const historyList = document.getElementById('historyList');
        const item = document.createElement('li');
        item.className = 'history-item';
        
        const now = new Date();
        const timeStr = now.toTimeString().split(' ')[0];

        item.innerHTML = `
            <span>时间: ${timeStr}</span>
            <span>红球: <strong>${reds.join(', ')}</strong> | 蓝球: <strong style="color:#1971c2">${blue}</strong></span>
        `;
        historyList.insertBefore(item, historyList.firstChild);
    }

    function clearHistory() {
        document.getElementById('historyList').innerHTML = '';
    }
</script>

</body>
</html>
