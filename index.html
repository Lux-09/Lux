<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动车组接线员 - 调度终端</title>
    <style>
        /* CSS 重置与基础设置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* 背景：模拟动车段/调度大厅未来科技感背景 */
        #app-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 0, 0.1) 0%, transparent 40%),
                linear-gradient(135deg, #070a13 0%, #111827 100%);
            z-index: 1;
        }

        /* 轨道光效装饰线 */
        .track-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.2), transparent);
            height: 1px;
            width: 100%;
            z-index: 2;
        }
        .track-line:nth-child(1) { top: 20%; animation: scan 8s linear infinite; }
        .track-line:nth-child(2) { top: 70%; animation: scan 12s linear infinite reverse; }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 全屏容器：电脑与手机统一强制全屏占满 */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        /* 固态高光拟真玻璃 UI 核心样式（已柔化高光线条，告别生硬感） */
        .glass-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            /* 柔和的渐变顶部高光，模拟环境光反射 */
            border-top: 1px solid rgba(255, 255, 255, 0.18); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        /* 头部：游戏标题区 */
        header {
            text-align: center;
            margin-top: 2vh;
        }

        .game-subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #00f2fe;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* 中部：动态或核心状态显示玻璃窗 */
        .center-display {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 8px;
        }

        .status-value {
            color: #38bdf8;
            font-family: monospace;
            font-weight: bold;
        }

        /* 可选择区段的点击触发样式 */
        .selectable-area {
            cursor: pointer;
            color: #00f2fe;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: opacity 0.2s;
        }
        .selectable-area:hover {
            opacity: 0.8;
        }

        /* 底部：操作菜单与按钮区 */
        .menu-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1vh;
        }

        .glass-btn {
            position: relative;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2); /* 柔化按钮顶部高光 */
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2),
                        inset 0 1px 1px rgba(255, 255, 255, 0.15);
            overflow: hidden;
        }

        /* 按钮光泽扫过效果（柔和化） */
        .glass-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .glass-btn:hover::after {
            left: 100%;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2),
                        inset 0 1px 2px rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(79, 172, 254, 0.15));
            border-color: rgba(0, 242, 254, 0.3);
        }

        /* 作者与联系区 */
        .footer-info {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 1vh;
        }

        .author-text {
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .contact-link-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .contact-link-btn:hover {
            color: #00f2fe;
        }

        /* 游戏内玻璃拟态弹窗遮罩 */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 90%;
            max-width: 380px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00f2fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .modal-body {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
            word-break: break-all;
        }

        .modal-close-btn {
            margin-top: 8px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 选项列表按钮（用于区段选择） */
        .option-item {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div id="app-background">
        <div class="track-line"></div>
        <div class="track-line"></div>
    </div>

    <!-- 游戏主视口 (强制全屏) -->
    <div id="game-container">
        
        <!-- 标题区 -->
        <header>
            <div class="game-subtitle">CRH Dispatcher System</div>
            <h1 class="game-title">动车组接线员</h1>
        </header>

        <!-- 中部状态与区段显示玻璃面板 -->
        <div class="glass-panel center-display">
            <div class="status-item">
                <span>系统状态</span>
                <span class="status-value">🟢 测试终端就绪</span>
            </div>
            <div class="status-item">
                <span>当前调度区段</span>
                <span class="status-value selectable-area" id="current-dispatch-area" onclick="openAreaSelector()">京沪高铁 - 03号枢纽 (点击切换)</span>
            </div>
            <div class="status-item">
                <span>当前版本</span>
                <span class="status-value">内部版本02</span>
            </div>
        </div>

        <!-- 底部菜单与交互按钮 -->
        <div class="menu-container">
            <button class="glass-btn btn-primary" onclick="startGame()">开始接车</button>
            <button class="glass-btn" onclick="openUpdates()">更新日志</button>
        </div>

        <!-- 作者与联系区 -->
        <div class="footer-info">
            <div class="author-text">Lux作者制作</div>
            <button class="contact-link-btn" onclick="openContact()">QQ邮箱联系</button>
        </div>

    </div>

    <!-- 游戏内统一毛玻璃弹窗 -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box glass-panel" onclick="event.stopPropagation()">
            <div class="modal-title" id="modal-title">提示</div>
            <div class="modal-body" id="modal-content">弹窗内容...</div>
            <div id="modal-actions">
                <button class="modal-close-btn" style="width:100%;" onclick="closeModalDirect()" id="modal-btn-text">确定</button>
            </div>
        </div>
    </div>

    <script>
        // 当前选择的调度区段
        let selectedArea = "京沪高铁 - 03号枢纽";

        // 弹窗控制函数
        function showModal(title, content, customActionsHTML = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = content;
            
            const actionsContainer = document.getElementById('modal-actions');
            if (customActionsHTML) {
                actionsContainer.innerHTML = customActionsHTML;
            } else {
                actionsContainer.innerHTML = `<button class="modal-close-btn" style="width:100%;" onclick="closeModalDirect()">确定</button>`;
            }

            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModalDirect() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function closeModal(e) {
            if (e.target.id === 'modal-overlay') {
                closeModalDirect();
            }
        }

        // 1. 玩家自定义选择调度区段功能
        function openAreaSelector() {
            const areas = [
                "京沪高铁 - 华东调度枢纽",
                "京广高铁 - 武汉核心枢纽",
                "沪昆高铁 - 东南调度中心",
                "成渝客专 - 西南调度中心",
                "徐兰客专 - 西北调度中心",
                "京津冀城际 - 北京调度中心"
            ];

            let html = '<div style="display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto;">';
            areas.forEach(area => {
                html += `<button class="option-item" onclick="selectArea('${area}')">${area}</button>`;
            });
            html += '</div>';

            showModal("选择调度区段", "请选择您要接管的高铁干线调度枢纽：", html);
        }

        function selectArea(areaName) {
            selectedArea = areaName;
            document.getElementById('current-dispatch-area').innerText = areaName + " (点击切换)";
            closeModalDirect();
        }

        // 2. 按钮交互响应
        function startGame() {
            showModal("提示", `当前区段【${selectedArea}】接车程序正在紧急筹备中，核心玩法将在后续版本开放！`);
        }

        function openUpdates() {
            showModal("更新日志 (内部版本02)", 
                "• <b>版本升级</b>：正式更名为内部版本02。<br>" +
                "• <b>视觉优化</b>：全面柔化高光线条，改用细腻自然的拟真玻璃光泽，告别生硬感。<br>" +
                "• <b>自由调度</b>：新增调度区段自由选择功能，玩家可自主切换心仪的高铁干线。"
            );
        }

        function openContact() {
            showModal("联系作者", 
                "如果您在测试过程中遇到任何Bug或有好的建议，欢迎通过QQ邮箱与我联系：<br><br>" +
                "<b style='color:#00f2fe; font-size:1.05rem;'>2210380754@qq.com</b><br><br>" +
                "<span style='color:#f87171; font-size:0.85rem;'>⚠️ 反馈请备注游戏反馈</span>"
            );
        }
    </script>
</body>
</html>
