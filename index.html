<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>动车组接线员</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "Microsoft YaHei",
    "PingFang SC",
    Arial,
    sans-serif;
}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;

}


/* 游戏主窗口 */

.game-screen{

    width:100vw;
    height:100vh;

    background:

    linear-gradient(
        135deg,
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.05)
    ),

    linear-gradient(
        120deg,
        #07111f,
        #12365a,
        #07111f
    );

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;

}



/* 背景动态光 */

.light{

    position:absolute;

    width:80vw;
    height:80vw;

    max-width:900px;
    max-height:900px;

    background:

    radial-gradient(
        circle,
        rgba(255,255,255,0.25),
        transparent 70%
    );

    filter:blur(40px);

    animation:moveLight 8s infinite alternate;

}



@keyframes moveLight{

    from{
        transform:translate(-10%,-10%);
    }

    to{
        transform:translate(10%,10%);
    }

}



/* 玻璃主卡片 */

.cover-panel{


    width:90%;
    max-width:900px;

    height:75%;


    background:

    linear-gradient(
        145deg,
        rgba(255,255,255,0.35),
        rgba(255,255,255,0.08)
    );


    backdrop-filter:blur(25px);

    -webkit-backdrop-filter:blur(25px);


    border-radius:40px;


    border:

    1px solid
    rgba(255,255,255,0.45);



    box-shadow:

    0 30px 80px
    rgba(0,0,0,0.45),

    inset 0 0 40px
    rgba(255,255,255,0.25);



    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;


    color:white;

    position:relative;

    overflow:hidden;

}




/* 顶部玻璃高光 */

.cover-panel::before{


    content:"";

    position:absolute;

    width:150%;

    height:50%;


    top:-40%;

    left:-20%;


    background:

    linear-gradient(
        transparent,
        rgba(255,255,255,0.35)
    );


    transform:rotate(-15deg);

}




/* 标题 */


.title{


    font-size:

    clamp(35px,6vw,80px);


    letter-spacing:

    8px;


    text-align:center;


    text-shadow:

    0 10px 30px
    rgba(0,0,0,0.6);


    z-index:2;


}




.subtitle{


    margin-top:25px;


    font-size:

    clamp(15px,2vw,25px);


    opacity:0.85;


    letter-spacing:5px;


    z-index:2;

}



/* 开始按钮 */


.start-btn{


    margin-top:70px;


    width:

    clamp(200px,35vw,350px);


    height:70px;



    border-radius:50px;


    border:

    1px solid
    rgba(255,255,255,0.7);



    background:

    linear-gradient(

        120deg,

        rgba(255,255,255,0.5),

        rgba(255,255,255,0.15)

    );


    backdrop-filter:blur(15px);



    color:white;


    font-size:25px;


    letter-spacing:8px;


    cursor:pointer;



    box-shadow:


    0 15px 40px

    rgba(0,0,0,0.35),


    inset 0 0 20px

    rgba(255,255,255,0.5);



    transition:.3s;



}



.start-btn:hover{


    transform:scale(1.08);


    background:

    rgba(255,255,255,0.35);


}



.start-btn:active{

    transform:scale(.95);

}



/* 底部版本 */

.version{


    position:absolute;

    bottom:25px;


    font-size:14px;


    opacity:.6;

}




/* 手机优化 */

@media(max-width:600px){


.cover-panel{


    width:92%;

    height:80%;


    border-radius:30px;


}



.title{


    letter-spacing:4px;


}



.start-btn{


    margin-top:50px;


    height:60px;


    font-size:20px;


}



}




</style>


</head>



<body>


<div class="game-screen">


<div class="light"></div>



<div class="cover-panel">


<h1 class="title">
动车组接线员
</h1>


<div class="subtitle">
HIGH SPEED TRAIN OPERATOR
</div>



<button class="start-btn">

开始运行

</button>



<div class="version">

GAME SYSTEM v0.1

</div>


</div>


</div>



<script>


// 后续这里连接游戏核心

.onclick=function(){

    alert("游戏系统加载中...");

    /*
    
    后续替换：

    location.href="main.html"

    进入正式游戏界面

    */

}


</script>



</body>
</html>
