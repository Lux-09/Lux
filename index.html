<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" 
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>动车组接线员</title>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;

font-family:
"Microsoft YaHei",
"PingFang SC",
Arial;

}



html,body{

width:100%;
height:100%;

overflow:hidden;

}



.game-screen{


width:100vw;
height:100vh;


background:

linear-gradient(
135deg,
#071522,
#16456b,
#071522
);


display:flex;

justify-content:center;

align-items:center;


position:relative;


}




.light{


position:absolute;

width:80vw;

height:80vw;


background:

radial-gradient(

circle,

rgba(255,255,255,.3),

transparent 70%

);


filter:blur(50px);


animation:lightMove 8s infinite alternate;


}



@keyframes lightMove{


from{

transform:translate(-10%,-10%);

}


to{

transform:translate(10%,10%);

}


}





.glass-panel{


width:90%;

max-width:850px;


height:75%;



background:

linear-gradient(

145deg,

rgba(255,255,255,.35),

rgba(255,255,255,.08)

);



backdrop-filter:blur(25px);


-webkit-backdrop-filter:blur(25px);



border-radius:40px;


border:

1px solid rgba(255,255,255,.5);



box-shadow:

0 30px 80px rgba(0,0,0,.5),

inset 0 0 40px rgba(255,255,255,.25);



display:flex;

flex-direction:column;

justify-content:center;

align-items:center;



color:white;



}



.title{


font-size:

clamp(35px,6vw,80px);


letter-spacing:8px;


text-shadow:

0 10px 30px rgba(0,0,0,.5);


}



.subtitle{


margin-top:25px;


font-size:

clamp(15px,2vw,25px);


letter-spacing:5px;


opacity:.8;


}




button{


cursor:pointer;

}



.start-btn{


margin-top:70px;


width:

clamp(220px,40vw,360px);


height:70px;


border-radius:50px;



border:

1px solid rgba(255,255,255,.7);



background:

rgba(255,255,255,.18);



color:white;


font-size:25px;


letter-spacing:6px;



backdrop-filter:blur(15px);



box-shadow:

0 15px 40px rgba(0,0,0,.4);


transition:.3s;


}



.start-btn:hover{


transform:scale(1.08);


}





.version{


position:absolute;

bottom:25px;


opacity:.7;

font-size:14px;


}





/* 登录界面 */


.login-box{


display:none;


width:100%;

height:100%;


flex-direction:column;

align-items:center;

justify-content:center;


}




.login-title{


font-size:40px;


letter-spacing:8px;


}



.input{


margin-top:25px;


width:70%;


max-width:400px;


height:55px;


border-radius:30px;



border:

1px solid rgba(255,255,255,.5);



background:

rgba(255,255,255,.15);



color:white;


font-size:20px;


padding-left:25px;


outline:none;


}




.input::placeholder{

color:rgba(255,255,255,.7);

}





.login-btn{


margin-top:40px;


width:250px;


height:60px;


border-radius:40px;


background:

rgba(255,255,255,.3);



border:

1px solid white;



color:white;


font-size:22px;


letter-spacing:5px;


}





.back-btn{


margin-top:20px;


background:none;


border:none;


color:white;


opacity:.7;


}





@media(max-width:600px){



.glass-panel{


height:82%;


border-radius:30px;


}



.login-title{


font-size:30px;


}



.input{


width:85%;


}


}



</style>


</head>



<body>


<div class="game-screen">


<div class="light"></div>



<div class="glass-panel">



<!-- 开始界面 -->


<div id="startPage">


<div class="title">

动车组接线员

</div>


<div class="subtitle">

HIGH SPEED TRAIN OPERATOR

</div>



<button class="start-btn"
onclick="openLogin()">

开始运行

</button>


</div>





<!-- 登录界面 -->


<div class="login-box" id="loginPage">


<div class="login-title">

系统登录

</div>



<input 
class="input"
id="account"
placeholder="输入账号">


<input 
class="input"
id="password"
type="password"
placeholder="输入密码">



<button class="login-btn"
onclick="login()">

进入系统

</button>



<button class="back-btn"
onclick="backStart()">

返回首页

</button>



</div>



<div class="version">

内测版本01

</div>



</div>


</div>





<script>


/*

========================

账号管理区域

以后你只需要修改这里

增加账号：

{
account:"xxx",
password:"xxx"
}


删除账号：

直接删除对应行


========================

*/


let accounts=[


{

account:"admin",

password:"123456"

},


{

account:"tester01",

password:"test001"

}


];







function openLogin(){


document.getElementById("startPage")
.style.display="none";


document.getElementById("loginPage")
.style.display="flex";


}





function backStart(){


document.getElementById("loginPage")
.style.display="none";


document.getElementById("startPage")
.style.display="block";


}







function login(){



let user=
document.getElementById("account").value;


let pass=
document.getElementById("password").value;



let result=
accounts.find(item=>

item.account===user
&&
item.password===pass

);




if(result){


alert(
"登录成功\n欢迎进入动车组调度系统"
);


/*

下一阶段替换：

window.location.href="main.html";


进入正式游戏


*/



}

else{


alert(
"账号或密码错误"
);


}




}




</script>


</body>

</html>
