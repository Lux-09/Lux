<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>货运安全管控中心 - 主控台</title>
    <style>
        /* ============ 全局重置 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", "Consolas", "Monaco", "PingFang SC", "Microsoft YaHei", monospace;
            background-color: #0a0e14;
            /* 兜底底色，如果背景图加载不出来也不至于白屏 */
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ 背景层 ============ */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            /* 默认使用桌面背景 */
            background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBRqmB-Du5k_LwKaKBZ_pP8Xe8F-RAACPDIAAm9BwFTn4jHKMQj3BT0E.png');
            transition: background-image 0.4s ease;
            /* 加个暗色遮罩，让文字更清晰 */
        }

        /* 叠加一层半透明暗色蒙版，提升可读性 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: rgba(4, 8, 15, 0.45);
            pointer-events: none;
            /* 不阻挡点击 */
        }

        /* 扫描线效果 - 增加监控感 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
        }

        /* 一个微妙的噪点纹理，用CSS模拟 */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.018;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* ============ 移动端背景切换 ============ */
        @media (max-width: 768px) {
            .bg-layer {
                background-image: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBpqmB_fy9hW3tF6MFfYQmVsxVhucwACRDIAAm9BwFTO1OmTfbyBcj0E.png');
            }
            /* 移动端蒙版稍微深一点，因为手机屏幕亮度高 */
            .bg-overlay {
                background: rgba(4, 8, 15, 0.52);
            }
        }

        /* 针对非常小的手机做微调 */
        @media (max-width: 380px) {
            .bg-overlay {
                background: rgba(4, 8, 15, 0.58);
            }
        }

        /* ============ 主界面容器 ============ */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============ 顶部状态栏 ============ */
        .top-status {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #b8d8e8;
            text-shadow: 0 0 8px rgba(100, 180, 220, 0.5);
            z-index: 20;
            pointer-events: none;
            /* 纯展示 */
        }

        .top-status .sys-name {
            font-weight: bold;
            color: #7dd3e8;
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .top-status .sys-time {
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            opacity: 0.75;
            letter-spacing: 1px;
        }

        /* 左上角两个小指示灯 */
        .indicator-dots {
            display: flex;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .indicator-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #44dd88;
            box-shadow: 0 0 6px #44dd88;
            animation: pulse-dot 2.2s ease-in-out infinite;
        }
        .indicator-dots .dot.amber {
            background: #ffaa33;
            box-shadow: 0 0 6px #ffaa33;
            animation-delay: 1.1s;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        /* ============ 中央核心区 ============ */
        .core-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            max-width: 680px;
            width: 100%;
            /* 稍微往上偏移一点让视觉更集中 */
            transform: translateY(-2vh);
        }

        /* 标题主框 */
        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-main-title {
            font-size: clamp(28px, 6vw, 54px);
            font-weight: 700;
            letter-spacing: 6px;
            color: #e8f4fa;
            text-shadow:
                0 0 16px rgba(120, 200, 240, 0.7),
                0 0 40px rgba(80, 160, 200, 0.4),
                0 2px 4px rgba(0, 0, 0, 0.6);
            line-height: 1.15;
            text-transform: uppercase;
            /* 保留中文，但英文部分大写 */
        }

        .game-sub-title {
            font-size: clamp(11px, 2vw, 15px);
            letter-spacing: 8px;
            color: #9cc8dc;
            text-shadow: 0 0 10px rgba(100, 180, 220, 0.5);
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* 分隔装饰线 */
        .divider-line {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
            max-width: 420px;
            margin: 4px 0 6px;
        }
        .divider-line .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(140, 200, 230, 0.5), transparent);
        }
        .divider-line .diamond {
            width: 8px;
            height: 8px;
            background: #7dd3e8;
            transform: rotate(45deg);
            box-shadow: 0 0 10px #7dd3e8;
            flex-shrink: 0;
        }

        /* 版本号 */
        .version-tag {
            font-size: 10px;
            letter-spacing: 3px;
            color: #6a8fa0;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* ============ 按钮区域 ============ */
        .button-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
            width: 100%;
        }

        /* 主按钮 - 开始游戏 */
        .btn-start {
            position: relative;
            display: inline-block;
            padding: 16px 52px;
            font-family: inherit;
            font-size: clamp(16px, 2.5vw, 20px);
            font-weight: 600;
            letter-spacing: 4px;
            color: #d8ecf4;
            background: rgba(10, 20, 30, 0.55);
            border: 1.5px solid rgba(120, 190, 220, 0.6);
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.25s ease;
            /* 不需要太完美，有一点不对称 */
            text-shadow: 0 0 8px rgba(150, 210, 240, 0.6);
            box-shadow:
                0 0 20px rgba(80, 160, 200, 0.2),
                inset 0 0 18px rgba(80, 160, 200, 0.08);
            outline: none;
            /* 去掉默认focus样式，我们自己做 */
            -webkit-appearance: none;
            appearance: none;
            background-clip: padding-box;
        }

        .btn-start:hover {
            background: rgba(15, 30, 42, 0.7);
            border-color: rgba(150, 220, 250, 0.85);
            box-shadow:
                0 0 32px rgba(100, 190, 230, 0.4),
                inset 0 0 24px rgba(100, 190, 230, 0.12);
            color: #f0f8fc;
            transform: translateY(-1px);
        }

        .btn-start:active {
            transform: translateY(1px);
            box-shadow:
                0 0 14px rgba(80, 160, 200, 0.3),
                inset 0 0 20px rgba(80, 160, 200, 0.15);
            background: rgba(8, 16, 24, 0.8);
        }

        /* 聚焦时的替代样式 */
        .btn-start:focus-visible {
            border-color: rgba(160, 225, 255, 0.9);
            box-shadow:
                0 0 24px rgba(100, 190, 230, 0.5),
                inset 0 0 20px rgba(100, 190, 230, 0.1);
        }

        /* 按钮上的小标记 - 像终端里的光标 */
        .btn-start::after {
            content: "▮";
            margin-left: 8px;
            font-size: 14px;
            opacity: 0.7;
            animation: blink-cursor 1.1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink-cursor {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 0;
            }
        }

        /* 次要按钮 - 设置/关于 */
        .btn-secondary {
            padding: 8px 26px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 3px;
            color: #7a9dad;
            background: transparent;
            border: 1px solid rgba(110, 150, 170, 0.35);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.22s ease;
            text-transform: uppercase;
            opacity: 0.7;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-secondary:hover {
            opacity: 1;
            border-color: rgba(140, 190, 215, 0.7);
            color: #b8dce8;
            background: rgba(10, 20, 30, 0.35);
        }
        .btn-secondary:focus-visible {
            border-color: rgba(150, 210, 240, 0.8);
            opacity: 1;
        }

        /* 底部小字 - 系统提示 */
        .hint-text {
            font-size: 9.5px;
            letter-spacing: 2px;
            color: #56788a;
            opacity: 0.55;
            margin-top: 6px;
            text-align: center;
            line-height: 1.6;
            pointer-events: none;
        }

        /* ============ 底部角落装饰 ============ */
        .corner-decor {
            position: absolute;
            z-index: 15;
            pointer-events: none;
            opacity: 0.45;
            font-size: 10px;
            letter-spacing: 2px;
            color: #6a9aa8;
        }
        .corner-decor.bottom-left {
            bottom: 16px;
            left: 20px;
            text-align: left;
            line-height: 1.7;
        }
        .corner-decor.bottom-right {
            bottom: 16px;
            right: 20px;
            text-align: right;
            line-height: 1.7;
        }

        /* 屏幕角落的L形边框装饰 - 像监控摄像头的取景框 */
        .corner-frame {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
        }
        .corner-frame .corner-line {
            position: absolute;
            background: rgba(130, 190, 220, 0.5);
        }
        .corner-frame.tl {
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid rgba(130, 190, 220, 0.7);
            border-left: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.tr {
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid rgba(130, 190, 220, 0.7);
            border-right: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.bl {
            bottom: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid rgba(130, 190, 220, 0.7);
            border-left: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.br {
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid rgba(130, 190, 220, 0.7);
            border-right: 2px solid rgba(130, 190, 220, 0.7);
        }

        /* ============ 响应式微调 ============ */
        @media (max-width: 768px) {
            .top-status {
                padding: 10px 14px;
                font-size: 10px;
                letter-spacing: 1px;
            }
            .top-status .sys-name {
                font-size: 11px;
                letter-spacing: 1.5px;
            }
            .top-status .sys-time {
                font-size: 11px;
            }
            .core-area {
                gap: 16px;
                transform: translateY(-1vh);
            }
            .game-main-title {
                letter-spacing: 3px;
            }
            .game-sub-title {
                letter-spacing: 4px;
            }
            .btn-start {
                padding: 14px 38px;
                font-size: 15px;
                letter-spacing: 3px;
            }
            .divider-line {
                width: 88%;
                max-width: 320px;
            }
            .corner-decor {
                font-size: 8px;
                letter-spacing: 1px;
            }
            .corner-decor.bottom-left {
                bottom: 10px;
                left: 12px;
            }
            .corner-decor.bottom-right {
                bottom: 10px;
                right: 12px;
            }
            .corner-frame.tl,
            .corner-frame.tr,
            .corner-frame.bl,
            .corner-frame.br {
                width: 20px;
                height: 20px;
            }
            .corner-frame.tl {
                top: 6px;
                left: 6px;
            }
            .corner-frame.tr {
                top: 6px;
                right: 6px;
            }
            .corner-frame.bl {
                bottom: 6px;
                left: 6px;
            }
            .corner-frame.br {
                bottom: 6px;
                right: 6px;
            }
        }

        /* 高DPI屏幕下扫描线减弱 */
        @media (-webkit-min-device-pixel-ratio: 2) {
            .scanlines {
                background: repeating-linear-gradient(0deg,
                        transparent,
                        transparent 3px,
                        rgba(0, 0, 0, 0.02) 3px,
                        rgba(0, 0, 0, 0.02) 6px);
            }
        }

        /* 横屏手机提示 */
        @media (max-width: 768px) and (orientation: landscape) {
            .main-container {
                padding: 10px;
            }
            .core-area {
                gap: 10px;
                transform: translateY(0);
            }
            .game-main-title {
                font-size: clamp(20px, 4.5vw, 30px);
                letter-spacing: 3px;
            }
            .btn-start {
                padding: 10px 28px;
                font-size: 13px;
            }
            .game-sub-title {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景图片层 -->
    <div class="bg-layer" id="bgLayer" aria-hidden="true"></div>

    <!-- 暗色遮罩 -->
    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- 扫描线效果 -->
    <div class="scanlines" aria-hidden="true"></div>

    <!-- 噪点纹理 -->
    <div class="noise" aria-hidden="true"></div>

    <!-- 四个角落的取景框装饰 -->
    <div class="corner-frame tl" aria-hidden="true"></div>
    <div class="corner-frame tr" aria-hidden="true"></div>
    <div class="corner-frame bl" aria-hidden="true"></div>
    <div class="corner-frame br" aria-hidden="true"></div>

    <!-- 主内容容器 -->
    <div class="main-container">

        <!-- 顶部状态栏 -->
        <div class="top-status">
            <div class="indicator-dots">
                <span class="dot" aria-hidden="true"></span>
                <span class="dot amber" aria-hidden="true"></span>
                <span class="sys-name">FSCS · 主控中心</span>
            </div>
            <span class="sys-time" id="sysTime">--:--:--</span>
        </div>

        <!-- 中央核心区 -->
        <div class="core-area">
            <!-- 标题 -->
            <div class="title-block">
                <h1 class="game-main-title">货运安全管控</h1>
                <p class="game-sub-title">Freight Security Command</p>
            </div>

            <!-- 分隔线 -->
            <div class="divider-line">
                <span class="line"></span>
                <span class="diamond"></span>
                <span class="line"></span>
            </div>

            <!-- 版本号 -->
            <span class="version-tag">v0.1.0 &nbsp;|&nbsp; BUILD 2024.11</span>

            <!-- 按钮 -->
            <div class="button-area">
                <button class="btn-start" id="btnStart" type="button">开始任务</button>
                <button class="btn-secondary" id="btnSettings" type="button">系统设置</button>
            </div>

            <!-- 提示文字 -->
            <p class="hint-text">
                &gt; 链路检测中 ... 所有货柜监控节点在线 &lt;<br>
                &gt; 按 [ENTER] 快速进入指挥台 &lt;
            </p>
        </div>

        <!-- 底部角落信息 -->
        <div class="corner-decor bottom-left" aria-hidden="true">
            节点: CQ-07 &nbsp;|&nbsp; 线路: 渝新欧<br>
            延迟: 12ms &nbsp;|&nbsp; 加密: AES-256
        </div>
        <div class="corner-decor bottom-right" aria-hidden="true">
            FSCS 安全管控系统<br>
            © 2024 货运安保部
        </div>

    </div>

    <script>
        (function() {
            // ============ 实时时钟 ============
            function updateClock() {
                var el = document.getElementById('sysTime');
                if (!el) return;
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                el.textContent = hh + ':' + mm + ':' + ss + ' CST';
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ============ 背景图片加载兜底 ============
            var bgLayer = document.getElementById('bgLayer');
            if (bgLayer) {
                // 判断当前是否移动端
                var isMobile = window.innerWidth <= 768;
                var bgUrl = isMobile ?
                    'https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBpqmB_fy9hW3tF6MFfYQmVsxVhucwACRDIAAm9BwFTO1OmTfbyBcj0E.png' :
                    'https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBRqmB-Du5k_LwKaKBZ_pP8Xe8F-RAACPDIAAm9BwFTn4jHKMQj3BT0E.png';

                // 预加载验证，如果加载失败则使用深色底
                var testImg = new Image();
                testImg.onload = function() {
                    // 成功加载，背景已经在CSS中设置了，不用额外操作
                };
                testImg.onerror = function() {
                    // 加载失败，设置纯色背景
                    bgLayer.style.backgroundImage = 'none';
                    bgLayer.style.backgroundColor = '#0c1218';
                };
                testImg.src = bgUrl;

                // 监听窗口大小变化，更新背景（但CSS媒体查询已经处理了，这里作为双保险）
                window.addEventListener('resize', function() {
                    var nowMobile = window.innerWidth <= 768;
                    // 只在跨越断点时做平滑切换
                    if (nowMobile !== isMobile) {
                        isMobile = nowMobile;
                        var newBgUrl = isMobile ?
                            'https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBpqmB_fy9hW3tF6MFfYQmVsxVhucwACRDIAAm9BwFTO1OmTfbyBcj0E.png' :
                            'https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEaXBRqmB-Du5k_LwKaKBZ_pP8Xe8F-RAACPDIAAm9BwFTn4jHKMQj3BT0E.png';
                        bgLayer.style.backgroundImage = 'url("' + newBgUrl + '")';

                        // 再次预加载验证
                        var t2 = new Image();
                        t2.onerror = function() {
                            bgLayer.style.backgroundImage = 'none';
                            bgLayer.style.backgroundColor = '#0c1218';
                        };
                        t2.src = newBgUrl;
                    }
                });
            }

            // ============ 按钮交互 ============
            var btnStart = document.getElementById('btnStart');
            var btnSettings = document.getElementById('btnSettings');

            // 开始按钮
            if (btnStart) {
                btnStart.addEventListener('click', function(e) {
                    // 加一个简单的按压反馈
                    btnStart.style.transform = 'translateY(1px)';
                    setTimeout(function() {
                        btnStart.style.transform = '';
                    }, 120);

                    // 这里预留：后续接入真正的游戏入口
                    // 现在先展示一个简单的提示
                    showBootMessage('正在连接主控网络 ... 请稍候');
                });

                // 鼠标移入移出时的边缘发光微调
                btnStart.addEventListener('mouseenter', function() {
                    // 额外效果不用额外代码，CSS已经处理
                });
            }

            // 设置按钮 - 占位
            if (btnSettings) {
                btnSettings.addEventListener('click', function(e) {
                    btnSettings.style.transform = 'translateY(1px)';
                    setTimeout(function() {
                        btnSettings.style.transform = '';
                    }, 100);
                    showBootMessage('设置面板暂未开放 · 敬请期待');
                });
            }

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', function(e) {
                // 按Enter键快速开始
                if (e.key === 'Enter' || e.keyCode === 13) {
                    if (btnStart) {
                        btnStart.click();
                    }
                    e.preventDefault();
                }
                // 按S键模拟设置
                if (e.key === 's' || e.key === 'S') {
                    if (btnSettings) {
                        btnSettings.click();
                    }
                    e.preventDefault();
                }
            });

            // ============ 简单消息提示（临时用的，不用弹窗） ============
            function showBootMessage(msg) {
                var hintEl = document.querySelector('.hint-text');
                if (!hintEl) return;
                var originalText = hintEl.innerHTML;
                hintEl.textContent = '> ' + msg + ' <';
                hintEl.style.opacity = '0.9';
                hintEl.style.color = '#a8ccd8';

                // 3.5秒后恢复
                clearTimeout(hintEl._msgTimer);
                hintEl._msgTimer = setTimeout(function() {
                    hintEl.innerHTML = originalText;
                    hintEl.style.opacity = '';
                    hintEl.style.color = '';
                }, 3500);
            }

            // ============ 防止移动端双击缩放干扰 ============
            document.addEventListener('dblclick', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ============ 初始加载时检查背景 ============
            // 确保在DOMContentLoaded后执行一次背景检测
            window.addEventListener('load', function() {
                if (bgLayer) {
                    var computedBg = getComputedStyle(bgLayer).backgroundImage;
                    if (!computedBg || computedBg === 'none' || computedBg === 'url("none")') {
                        bgLayer.style.backgroundColor = '#0c1218';
                    }
                }
            });

        })();
    </script>
</body>
</html>
