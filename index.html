<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动车组接线员 - 游戏开始</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            color: #ffffff;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 背景动车元素装饰 */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.15);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 480px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .game-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        .game-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(56, 189, 248, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.4), rgba(37, 99, 235, 0.4));
            border-color: rgba(56, 189, 248, 0.5);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.6), rgba(37, 99, 235, 0.6));
        }

        .version-info {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* 移动端适配调整 */
        @media (max-width: 480px) {
            .container {
                width: 92%;
                padding: 30px 20px;
            }
            .game-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow" style="top: 10%; left: 10%;"></div>
    <div class="bg-glow" style="bottom: 10%; right: 10%;"></div>

    <div class="container">
        <h1 class="game-title">动车组接线员</h1>
        <p class="game-subtitle">EMU Dispatcher Simulation</p>
        
        <div class="menu-list">
            <button class="btn btn-primary" onclick="startGame()">开始接线</button>
            <button class="btn" onclick="openSettings()">游戏设置</button>
            <button class="btn" onclick="openUpdates()">更新日志</button>
        </div>

        <div class="version-info">
            Version 1.0.0 | Prepared for Future Updates
        </div>
    </div>

    <script>
        function startGame() {
            alert("即将进入调度台，准备接线...");
            // 后续可以在这里编写跳转到游戏主界面的逻辑
        }

        function openSettings() {
            alert("设置面板开发中...");
        }

        function openUpdates() {
            alert("当前为初始版本：v0.0.1");
        }
    </script>
</body>
</html>
