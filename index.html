<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>理性抉择 · 彩票警示模拟器</title>
    <style>
        /* ============================================
           全局样式与CSS变量
           ============================================ */
        :root {
            --primary-red: #B71C1C;
            --deep-red: #7F1D1D;
            --dark-red: #4A0E0E;
            --gold: #D4A94E;
            --light-gold: #E8C87A;
            --dark-gold: #A07828;
            --bg-dark: #1A1210;
            --bg-panel: #2C1F18;
            --bg-content: #F7F3EC;
            --bg-card: #FFFFFF;
            --bg-muted: #F0EAE0;
            --text-light: #F5F0E6;
            --text-dark: #2C2C2C;
            --text-muted: #6B5D4F;
            --border-gold: #D4A94E;
            --border-red: #B71C1C;
            --shadow-dark: rgba(0, 0, 0, 0.7);
            --shadow-gold: rgba(212, 169, 78, 0.35);
            --shadow-red: rgba(183, 28, 28, 0.3);
            --font-family: "SimSun", "STSong", "Noto Serif SC", "Source Han Serif SC", "宋体", serif;
            --font-size-base: 16px;
            --container-max-width: 1200px;
            --header-height: 70px;
            --footer-height: 50px;
        }

        @media (max-width: 768px) {
            :root {
                --font-size-base: 13px;
                --header-height: 55px;
                --footer-height: 40px;
                --container-max-width: 100%;
            }
        }
        @media (max-width: 480px) {
            :root {
                --font-size-base: 11px;
                --header-height: 45px;
                --footer-height: 35px;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            font-size: var(--font-size-base);
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font-family);
            background-color: var(--bg-dark);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at center, rgba(183, 28, 28, 0.2) 0%, rgba(26, 18, 16, 0.97) 70%),
                repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(212, 169, 78, 0.02) 60px, rgba(212, 169, 78, 0.02) 61px),
                repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(212, 169, 78, 0.02) 60px, rgba(212, 169, 78, 0.02) 61px);
        }
        #game-container {
            width: var(--container-max-width);
            max-width: 1200px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-panel);
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.9), 0 0 160px rgba(183, 28, 28, 0.3);
            position: relative;
            border-left: 3px solid var(--border-gold);
            border-right: 3px solid var(--border-gold);
        }
        @media (max-width: 768px) {
            #game-container {
                width: 100%;
                border-left: none;
                border-right: none;
                box-shadow: none;
            }
        }

        /* ============================================
           顶部标题栏
           ============================================ */
        .game-header {
            background: linear-gradient(180deg, #5C0E0E 0%, #3D0808 50%, #5C0E0E 100%);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--border-gold);
            min-height: var(--header-height);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }
        .game-header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .header-emblem {
            width: 2.8rem;
            height: 2.8rem;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--gold);
            background: radial-gradient(circle, rgba(183, 28, 28, 0.6), rgba(74, 14, 14, 0.9));
            flex-shrink: 0;
            user-select: none;
            font-weight: 700;
        }
        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: var(--light-gold);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
            user-select: none;
        }
        .header-subtitle {
            font-size: 0.7rem;
            letter-spacing: 0.5em;
            color: rgba(245, 240, 230, 0.65);
            margin-top: 0.1rem;
            user-select: none;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.9rem;
            color: var(--light-gold);
        }
        .header-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.1rem;
        }
        .header-info-label {
            font-size: 0.6rem;
            letter-spacing: 0.25em;
            color: rgba(245, 240, 230, 0.55);
            text-transform: uppercase;
        }
        .header-info-value {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--light-gold);
            letter-spacing: 0.05em;
        }
        .header-funds {
            font-size: 1.4rem;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        @media (max-width: 768px) {
            .header-title {
                font-size: 1.1rem;
                letter-spacing: 0.2em;
            }
            .header-subtitle {
                font-size: 0.5rem;
                letter-spacing: 0.3em;
            }
            .header-emblem {
                width: 2rem;
                height: 2rem;
                font-size: 1rem;
                border-width: 1.5px;
            }
            .header-info-item {
                font-size: 0.65rem;
            }
            .header-info-value {
                font-size: 0.8rem;
            }
            .header-funds {
                font-size: 1.1rem;
            }
            .game-header {
                padding: 0.5rem 0.7rem;
            }
            .header-right {
                gap: 0.6rem;
            }
        }
        @media (max-width: 480px) {
            .header-title {
                font-size: 0.9rem;
                letter-spacing: 0.12em;
            }
            .header-subtitle {
                display: none;
            }
            .header-emblem {
                width: 1.6rem;
                height: 1.6rem;
                font-size: 0.8rem;
                border-width: 1px;
            }
            .header-info-label {
                font-size: 0.45rem;
                letter-spacing: 0.15em;
            }
            .header-info-value {
                font-size: 0.65rem;
            }
            .header-funds {
                font-size: 0.9rem;
            }
            .game-header {
                padding: 0.35rem 0.4rem;
            }
            .header-right {
                gap: 0.35rem;
            }
        }

        /* ============================================
           底部状态栏
           ============================================ */
        .game-footer {
            background: linear-gradient(0deg, #3D0808 0%, #5C0E0E 100%);
            color: rgba(245, 240, 230, 0.75);
            padding: 0.5rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 2px solid var(--border-gold);
            min-height: var(--footer-height);
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }
        .footer-left,
        .footer-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .footer-divider {
            width: 1px;
            height: 1.1rem;
            background: rgba(212, 169, 78, 0.4);
            margin: 0 0.4rem;
        }
        @media (max-width: 768px) {
            .game-footer {
                font-size: 0.55rem;
                padding: 0.35rem 0.5rem;
                letter-spacing: 0.05em;
            }
            .footer-divider {
                margin: 0 0.25rem;
                height: 0.8rem;
            }
        }
        @media (max-width: 480px) {
            .game-footer {
                font-size: 0.45rem;
                padding: 0.25rem 0.3rem;
            }
            .footer-divider {
                margin: 0 0.2rem;
                height: 0.6rem;
            }
        }

        /* ============================================
           主内容区域
           ============================================ */
        .game-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-content);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            min-height: calc(100vh - var(--header-height) - var(--footer-height));
        }
        .view {
            display: none;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1rem;
            flex: 1;
            animation: fadeIn 0.35s ease-out;
        }
        .view.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 768px) {
            .view {
                padding: 0.8rem;
                gap: 0.7rem;
            }
        }
        @media (max-width: 480px) {
            .view {
                padding: 0.4rem;
                gap: 0.4rem;
            }
        }

        /* ============================================
           通用组件
           ============================================ */
        .panel {
            background: var(--bg-card);
            border: 2px solid #D4C8B8;
            border-radius: 0.35rem;
            padding: 1.2rem 1.4rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.07);
            position: relative;
        }
        .panel::before {
            content: "";
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid rgba(212, 169, 78, 0.25);
            border-radius: 0.35rem;
            pointer-events: none;
        }
        .panel-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--deep-red);
            border-bottom: 2px solid var(--border-gold);
            padding-bottom: 0.45rem;
            margin-bottom: 0.9rem;
            letter-spacing: 0.15em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .panel-title::before {
            content: "◆";
            color: var(--gold);
            font-size: 0.8rem;
        }
        @media (max-width: 768px) {
            .panel {
                padding: 0.75rem 0.8rem;
                border-width: 1.5px;
                border-radius: 0.25rem;
            }
            .panel-title {
                font-size: 0.9rem;
                margin-bottom: 0.55rem;
                padding-bottom: 0.3rem;
                letter-spacing: 0.1em;
            }
        }
        @media (max-width: 480px) {
            .panel {
                padding: 0.5rem 0.5rem;
                border-width: 1px;
                border-radius: 0.2rem;
            }
            .panel-title {
                font-size: 0.75rem;
                margin-bottom: 0.35rem;
                padding-bottom: 0.2rem;
                letter-spacing: 0.05em;
            }
        }

        /* 按钮样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.4rem;
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            border: 2px solid var(--border-red);
            border-radius: 0.3rem;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            text-align: center;
            background-color: var(--bg-card);
            color: var(--deep-red);
            position: relative;
            overflow: hidden;
            min-width: 110px;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: var(--deep-red);
            color: var(--light-gold);
            border-color: var(--gold);
            box-shadow: 0 4px 24px var(--shadow-gold);
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 12px var(--shadow-gold);
        }
        .btn-primary {
            background: linear-gradient(180deg, var(--primary-red), var(--deep-red));
            color: var(--light-gold);
            border-color: var(--gold);
            box-shadow: 0 4px 18px rgba(183, 28, 28, 0.35);
        }
        .btn-primary:hover {
            background: linear-gradient(180deg, var(--deep-red), var(--dark-red));
            box-shadow: 0 6px 30px rgba(212, 169, 78, 0.45);
        }
        .btn-secondary {
            background-color: transparent;
            border-color: var(--gold);
            color: var(--dark-gold);
        }
        .btn-secondary:hover {
            background-color: rgba(212, 169, 78, 0.12);
            border-color: var(--light-gold);
            color: var(--gold);
        }
        .btn-danger {
            border-color: #6B1A1A;
            color: #6B1A1A;
        }
        .btn-danger:hover {
            background-color: #6B1A1A;
            color: #F5F0E6;
            border-color: #8B2A2A;
        }
        .btn-small {
            padding: 0.4rem 0.7rem;
            font-size: 0.75rem;
            min-width: 60px;
            border-width: 1.5px;
        }
        .btn-large {
            padding: 0.9rem 2.2rem;
            font-size: 1.05rem;
            min-width: 160px;
            letter-spacing: 0.15em;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn:disabled:hover {
            background-color: var(--bg-card);
            color: var(--deep-red);
            border-color: var(--border-red);
            transform: none;
            box-shadow: none;
        }
        .btn-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }
        @media (max-width: 768px) {
            .btn {
                padding: 0.45rem 0.9rem;
                font-size: 0.75rem;
                min-width: 70px;
                border-width: 1.5px;
                border-radius: 0.25rem;
            }
            .btn-large {
                padding: 0.6rem 1.4rem;
                font-size: 0.85rem;
                min-width: 110px;
            }
            .btn-small {
                padding: 0.3rem 0.5rem;
                font-size: 0.6rem;
                min-width: 45px;
            }
            .btn-group {
                gap: 0.4rem;
            }
        }
        @media (max-width: 480px) {
            .btn {
                padding: 0.35rem 0.6rem;
                font-size: 0.65rem;
                min-width: 50px;
                border-width: 1px;
                border-radius: 0.2rem;
            }
            .btn-large {
                padding: 0.5rem 1rem;
                font-size: 0.7rem;
                min-width: 80px;
                letter-spacing: 0.08em;
            }
            .btn-small {
                padding: 0.25rem 0.4rem;
                font-size: 0.55rem;
                min-width: 35px;
            }
            .btn-group {
                gap: 0.3rem;
            }
        }

        /* 彩票卡片 */
        .lottery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 0.8rem;
        }
        .lottery-card {
            background: var(--bg-card);
            border: 2px solid #D4C8B8;
            border-radius: 0.3rem;
            padding: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
            position: relative;
            text-align: center;
        }
        .lottery-card:hover {
            border-color: var(--border-red);
            box-shadow: 0 4px 20px rgba(183, 28, 28, 0.15);
            transform: translateY(-3px);
        }
        .lottery-card.selected {
            border-color: var(--border-red);
            background-color: #FDF5F0;
            box-shadow: 0 0 0 3px rgba(183, 28, 28, 0.15);
        }
        .lottery-card-name {
            font-weight: 700;
            color: var(--deep-red);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }
        .lottery-card-price {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .lottery-card-prize {
            font-size: 0.7rem;
            color: var(--dark-gold);
            font-weight: 600;
        }
        .lottery-card-desc {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            line-height: 1.4;
        }
        @media (max-width: 768px) {
            .lottery-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 0.5rem;
            }
            .lottery-card {
                padding: 0.6rem;
                border-width: 1.5px;
                border-radius: 0.25rem;
            }
            .lottery-card-name {
                font-size: 0.75rem;
            }
            .lottery-card-price {
                font-size: 0.65rem;
            }
            .lottery-card-prize {
                font-size: 0.6rem;
            }
            .lottery-card-desc {
                font-size: 0.55rem;
            }
        }
        @media (max-width: 480px) {
            .lottery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.35rem;
            }
            .lottery-card {
                padding: 0.4rem;
                border-width: 1px;
                border-radius: 0.2rem;
            }
            .lottery-card-name {
                font-size: 0.65rem;
            }
            .lottery-card-price {
                font-size: 0.55rem;
            }
            .lottery-card-prize {
                font-size: 0.5rem;
            }
            .lottery-card-desc {
                font-size: 0.45rem;
                display: none;
            }
        }

        /* 输入框 */
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }
        .input-field label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--deep-red);
            letter-spacing: 0.08em;
        }
        .input-field input,
        .input-field select {
            padding: 0.5rem 0.7rem;
            font-family: var(--font-family);
            font-size: 0.9rem;
            border: 2px solid #D4C8B8;
            border-radius: 0.25rem;
            background-color: #FDFCFA;
            color: var(--text-dark);
            transition: border-color 0.25s ease;
            outline: none;
            width: 100%;
        }
        .input-field input:focus,
        .input-field select:focus {
            border-color: var(--border-red);
            box-shadow: 0 0 0 3px rgba(183, 28, 28, 0.1);
        }
        @media (max-width: 768px) {
            .input-field input,
            .input-field select {
                padding: 0.35rem 0.5rem;
                font-size: 0.75rem;
                border-width: 1.5px;
            }
            .input-field label {
                font-size: 0.65rem;
            }
        }
        @media (max-width: 480px) {
            .input-field input,
            .input-field select {
                padding: 0.25rem 0.35rem;
                font-size: 0.65rem;
                border-width: 1px;
                border-radius: 0.2rem;
            }
            .input-field label {
                font-size: 0.55rem;
            }
        }

        /* 结果展示区 */
        .result-display {
            background: #FDF8F0;
            border: 2px solid var(--border-gold);
            border-radius: 0.3rem;
            padding: 1rem 1.2rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0.4rem;
        }
        .result-display .result-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--deep-red);
            letter-spacing: 0.08em;
        }
        .result-display .result-detail {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .result-display .result-amount {
            font-size: 1.6rem;
            font-weight: 900;
            color: #FF6600;
        }
        @media (max-width: 768px) {
            .result-display {
                padding: 0.7rem 0.8rem;
                min-height: 60px;
                border-width: 1.5px;
            }
            .result-display .result-text {
                font-size: 0.9rem;
            }
            .result-display .result-detail {
                font-size: 0.65rem;
            }
            .result-display .result-amount {
                font-size: 1.2rem;
            }
        }
        @media (max-width: 480px) {
            .result-display {
                padding: 0.5rem 0.5rem;
                min-height: 45px;
                border-width: 1px;
                border-radius: 0.2rem;
            }
            .result-display .result-text {
                font-size: 0.75rem;
            }
            .result-display .result-detail {
                font-size: 0.55rem;
            }
            .result-display .result-amount {
                font-size: 1rem;
            }
        }

        /* 统计面板 */
        .stats-row {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .stat-item {
            flex: 1;
            min-width: 90px;
            background: var(--bg-muted);
            border: 1px solid #D4C8B8;
            border-radius: 0.25rem;
            padding: 0.6rem 0.7rem;
            text-align: center;
            transition: all 0.2s ease;
        }
        .stat-item-value {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--deep-red);
        }
        .stat-item-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            margin-top: 0.15rem;
        }
        @media (max-width: 768px) {
            .stat-item {
                min-width: 65px;
                padding: 0.4rem 0.5rem;
                border-radius: 0.2rem;
            }
            .stat-item-value {
                font-size: 0.95rem;
            }
            .stat-item-label {
                font-size: 0.55rem;
                margin-top: 0.08rem;
            }
            .stats-row {
                gap: 0.4rem;
            }
        }
        @media (max-width: 480px) {
            .stat-item {
                min-width: 48px;
                padding: 0.3rem 0.35rem;
                border-width: 0.5px;

                    { prize: 100000, prob: 1 / 100000, label: '一等奖' },
                    { prize: 5000, prob: 1 / 10000, label: '二等奖' },
                    { prize: 500, prob: 1 / 1000, label: '三等奖' },
                    { prize: 50, prob: 1 / 100, label: '四等奖' },
                    { prize: 5, prob: 1 / 10, label: '五等奖' }
                ],
                qlc: [
                    { prize: 5000000, prob: 1 / 2035800, label: '一等奖' },
                    { prize: 100000, prob: 1 / 29083, label: '二等奖' },
                    { prize: 10000, prob: 1 / 1328, label: '三等奖' },
                    { prize: 200, prob: 1 / 312, label: '四等奖' },
                    { prize: 50, prob: 1 / 53, label: '五等奖' },
                    { prize: 10, prob: 1 / 17, label: '六等奖' },
                    { prize: 5, prob: 1 / 3, label: '七等奖' }
                ]
            };

            // ============================================
            // 游戏状态
            // ============================================
            let gameState = null;
            let selectedLottery = 'ssq';
            let scratchCanvasData = null;

            const $ = (id) => document.getElementById(id);

            // ============================================
            // 视图切换
            // ============================================
            function switchView(viewId) {
                const views = document.querySelectorAll('.view');
                views.forEach(v => v.classList.remove('active'));
                const target = $(viewId);
                if (target) {
                    target.classList.add('active');
                    if (viewId === 'view-game' && gameState) {
                        renderGameView();
                    }
                }
                const mainEl = $('gameMain');
                if (mainEl) mainEl.scrollTop = 0;
            }

            // ============================================
            // 游戏初始化
            // ============================================
            function startGame() {
                gameState = {
                    funds: INITIAL_FUNDS,
                    totalPurchases: 0,
                    totalSpent: 0,
                    totalWon: 0,
                    netProfit: 0,
                    history: [],
                    isGameOver: false,
                    gameResult: null,
                    startFunds: INITIAL_FUNDS
                };
                selectedLottery = 'ssq';
                switchView('view-game');
                renderGameView();
                updateHeaderInfo();
            }

            function resetToStart() {
                if (gameState && !gameState.isGameOver) {
                    if (!confirm('确定要重新开始吗？当前进度将丢失。')) return;
                }
                startGame();
            }

            // ============================================
            // 更新头部信息
            // ============================================
            function updateHeaderInfo() {
                if (!gameState) {
                    $('headerFunds').textContent = '¥10,000';
                    $('headerCount').textContent = '0';
                    $('headerNet').textContent = '¥0';
                    return;
                }
                $('headerFunds').textContent = formatMoney(gameState.funds);
                $('headerCount').textContent = gameState.totalPurchases;
                const netColor = gameState.netProfit >= 0 ? '' : ' style="color:#FF6B6B;"';
                $('headerNet').innerHTML = formatMoney(gameState.netProfit);
            }

            function formatMoney(amount) {
                if (amount >= 100000000) return '¥' + (amount / 100000000).toFixed(2) + '亿';
                if (amount >= 10000) return '¥' + (amount / 10000).toFixed(2) + '万';
                return '¥' + amount.toLocaleString('zh-CN');
            }

            // ============================================
            // 渲染游戏视图
            // ============================================
            function renderGameView() {
                if (!gameState) return;
                // 统计面板
                $('statFunds').textContent = formatMoney(gameState.funds);
                $('statPurchases').textContent = gameState.totalPurchases;
                $('statSpent').textContent = formatMoney(gameState.totalSpent);
                $('statWon').textContent = formatMoney(gameState.totalWon);
                $('statNet').textContent = formatMoney(gameState.netProfit);
                const winRate = gameState.totalPurchases > 0 ? ((gameState.history.filter(h => h.won).length / gameState
                    .totalPurchases) * 100).toFixed(1) + '%' : '0%';
                $('statWinRate').textContent = winRate;

                // 彩票选择
                const grid = $('lotteryGrid');
                if (grid) {
                    let html = '';
                    LOTTERY_TYPES.forEach(lt => {
                        const cls = lt.id === selectedLottery ? 'lottery-card selected' : 'lottery-card';
                        html += `<div class="${cls}" onclick="selectLotteryType('${lt.id}')">
                                <div class="lottery-card-name">${lt.icon} ${lt.name}</div>
                                <div class="lottery-card-price">${lt.desc}</div>
                                <div class="lottery-card-prize">最高奖金 ${formatMoney(lt.maxPrize)}</div>
                                <div class="lottery-card-desc">${lt.id === 'ggl' ? '即开型 · 刮开涂层查看结果' : '数字型 · 电脑开奖'}</div>
                            </div>`;
                    });
                    grid.innerHTML = html;
                }

                // 历史记录
                renderHistory();

                // 更新购买按钮状态
                const buyBtn = $('btnBuy');
                if (buyBtn) {
                    buyBtn.disabled = gameState.isGameOver;
                }

                updateHeaderInfo();
            }

            function selectLotteryType(id) {
                selectedLottery = id;
                renderGameView();
            }

            function renderHistory() {
                const listEl = $('historyList');
                if (!listEl || !gameState) return;
                if (gameState.history.length === 0) {
                    listEl.innerHTML = '<div class="history-entry">暂无记录。</div>';
                    return;
                }
                const entries = gameState.history.slice(-30).reverse();
                let html = '';
                entries.forEach(h => {
                    const typeCls = h.won ? 'history-win' : 'history-lose';
                    const amountCls = h.won ? 'win' : 'lose';
                    const amountStr = h.won ? '+' + formatMoney(h.prize) : '-' + formatMoney(h.cost);
                    html += `<div class="history-entry">
                            <span class="history-time">#${h.index}</span>
                            <span class="history-type ${typeCls}">${h.lotteryName}</span>
                            <span>${h.detail}</span>
                            <span class="history-amount ${amountCls}">${amountStr}</span>
                        </div>`;
                });
                listEl.innerHTML = html;
            }

            // ============================================
            // 购买与开奖逻辑
            // ============================================
            function buyLottery() {
                if (!gameState || gameState.isGameOver) return;
                const quantity = Math.max(1, Math.min(100, parseInt($('quantity').value) || 1));
                const lottery = LOTTERY_TYPES.find(l => l.id === selectedLottery);
                if (!lottery) return;

                const totalCost = lottery.price * quantity;
                if (gameState.funds < totalCost) {
                    alert('资金不足，无法购买。\n请减少购买数量或选择其他彩票。');
                    return;
                }

                // 扣除资金
                gameState.funds -= totalCost;
                gameState.totalSpent += totalCost;
                gameState.totalPurchases += quantity;

                let totalPrize = 0;
                let wonAny = false;
                let details = [];

                if (lottery.id === 'ggl') {
                    // 刮刮乐
                    for (let i = 0; i < quantity; i++) {
                        const result = drawSingleLottery(lottery.id);
                        totalPrize += result.prize;
                        if (result.prize > 0) wonAny = true;
                        details.push(result.label + (result.prize > 0 ? ' +¥' + result.prize : ''));
                    }
                } else {
                    // 数字型彩票
                    for (let i = 0; i < quantity; i++) {
                        const result = drawSingleLottery(lottery.id);
                        totalPrize += result.prize;
                        if (result.prize > 0) wonAny = true;
                        details.push(result.label + (result.prize > 0 ? ' +¥' + result.prize : ''));
                    }
                }

                // 更新资金
                gameState.funds += totalPrize;
                gameState.totalWon += totalPrize;
                gameState.netProfit = gameState.totalWon - gameState.totalSpent;

                // 记录历史
                const index = gameState.totalPurchases;
                gameState.history.push({
                    index: index,
                    lotteryName: lottery.name,
                    cost: totalCost,
                    prize: totalPrize,
                    won: totalPrize > 0,
                    detail: details.join(' · ') + (totalPrize > 0 ? ' | 中奖 ¥' + totalPrize : ' | 未中奖')
                });

                // 显示结果
                const resultDisplay = $('resultDisplay');
                if (resultDisplay) {
                    if (totalPrize > 0) {
                        resultDisplay.innerHTML = `
                            <span class="result-text" style="color:#2E7D32;">中奖！</span>
                            <span class="result-amount">+${formatMoney(totalPrize)}</span>
                            <span class="result-detail">${lottery.name} × ${quantity} | 花费 ${formatMoney(totalCost)} | 净收益 ${formatMoney(totalPrize - totalCost)}</span>
                        `;
                    } else {
                        resultDisplay.innerHTML = `
                            <span class="result-text" style="color:#B71C1C;">未中奖</span>
                            <span class="result-detail">${lottery.name} × ${quantity} | 花费 ${formatMoney(totalCost)}</span>
                        `;
                    }
                }

                // 检查结局
                if (gameState.funds >= TARGET_FUNDS) {
                    endGame('win');
                    return;
                }
                if (gameState.funds <= 0) {
                    endGame('lose');
                    return;
                }

                // 随机劝退提醒
                if (gameState.totalPurchases > 10 && Math.random() < 0.3) {
                    showWarningReminder();
                }

                renderGameView();
                updateHeaderInfo();
            }

            function drawSingleLottery(lotteryId) {
                const odds = ODDS[lotteryId];
                if (!odds) return { prize: 0, label: '未中奖' };

                let random = Math.random();
                let cumulative = 0;
                for (const tier of odds) {
                    cumulative += tier.prob;
                    if (random <= cumulative) {
                        return { prize: tier.prize, label: tier.label };
                    }
                }
                return { prize: 0, label: '未中奖' };
            }

            function showWarningReminder() {
                const warnings = [
                    '【提醒】您已连续购买多次，请注意控制购彩频率。',
                    '【警示】彩票中奖纯属概率事件，切勿抱有侥幸心理。',
                    '【忠告】理性购彩，量力而行。切勿将生活资金用于购买彩票。',
                    '【心理健康】如感到无法控制购彩冲动，请及时寻求专业帮助。',
                    '【法律提示】中国彩票为公益性质，严禁赌博。过度购买有害身心健康。'
                ];
                const msg = warnings[Math.floor(Math.random() * warnings.length)];
                alert(msg);
            }

            // ============================================
            // 结局系统
            // ============================================
            function endGame(type) {
                if (!gameState || gameState.isGameOver) return;
                gameState.isGameOver = true;
                gameState.gameResult = type;

                const endingTitle = $('endingTitle');
                const endingMessage = $('endingMessage');
                const endingLesson = $('endingLesson');

                if (type === 'win') {
                    endingTitle.textContent = '🏆 走向人生巅峰';
                    endingTitle.className = 'ending-title win';
                    endingMessage.textContent =
                        `恭喜您！您的总金额已达到 ${formatMoney(TARGET_FUNDS)}，成功实现"财富自由"。\n\n` +
                        `但这仅仅是模拟器中的极端概率事件。在现实生活中，彩票中得如此巨额大奖的概率微乎其微。` +
                        `真正的财富积累依靠的是辛勤劳动、理性投资和持续学习，而非寄望于运气。` +
                        `希望您能从这个模拟中认识到：彩票可以作为一种小额娱乐，但绝不能视为致富途径。`;
                    endingLesson.innerHTML = `
                        <strong>【警示教导】</strong><br>
                        1. 彩票中奖是极端小概率事件，本次"成功"仅为模拟器效果。<br>
                        2. 《中华人民共和国刑法》第303条规定：以营利为目的，聚众赌博或者以赌博为业的，处三年以下有期徒刑、拘役或者管制，并处罚金。<br>
                        3. 过度沉迷彩票可能导致家庭破裂、债务缠身和心理疾病。<br>
                        4. 请将时间和精力投入到工作、学习和家庭中，这才是真正的人生赢家之路。<br>
                        5. 如果您或身边的人有赌博倾向，请拨打心理援助热线寻求帮助。
                    `;
                } else {
                    endingTitle.textContent = '💸 您已破产';
                    endingTitle.className = 'ending-title lose';
                    endingMessage.textContent =
                        `很遗憾，您的资金已全部耗尽，宣告破产。\n\n` +
                        `在本次模拟中，您共购买 ${gameState.totalPurchases} 次彩票，总花费 ${formatMoney(gameState.totalSpent)}，` +
                        `总中奖 ${formatMoney(gameState.totalWon)}，净亏损 ${formatMoney(Math.abs(gameState.netProfit))}。` +
                        `这正是沉迷彩票的真实写照——绝大多数人最终都会以亏损告终。`;
                    endingLesson.innerHTML = `
                        <strong>【警示教导】</strong><br>
                        1. 彩票的本质是公益性质的娱乐活动，而非投资或致富手段。<br>
                        2. 数学上，彩票的期望收益为负值，长期购买必然亏损。<br>
                        3. 《彩票管理条例》明确规定：彩票发行机构、彩票销售机构、彩票代销者不得向未成年人销售彩票。<br>
                        4. 沉迷赌博式购彩会引发焦虑、抑郁等心理问题，严重时会导致家庭悲剧。<br>
                        5. 请珍惜您的时间和金钱，远离赌博陷阱。如有需要，请向专业心理机构寻求帮助。
                    `;
                }

                switchView('view-ending');
            }

            // ============================================
            // 关于系统
            // ============================================
            function showAboutInfo() {
                alert(
                    '═══════════════════════════════\n' +
                    '理 性 抉 择 · 彩票警示模拟器\n' +
                    '═══════════════════════════════\n' +
                    '版本：1.0\n' +
                    '类型：商业级警示模拟系统\n\n' +
                    '系统说明：\n' +
                    '1. 初始资金10,000元，目标10亿元。\n' +
                    '2. 可购买6种彩票，价格2-5元不等。\n' +
                    '3. 中奖概率参照真实彩票设计。\n' +
                    '4. 破产或达到10亿将触发结局。\n' +
                    '5. 本系统旨在揭示赌博危害，倡导理性购彩。\n\n' +
                    '【重要警示】\n' +
                    '本模拟器的所有中奖均为程序随机生成，\n' +
                    '不代表真实彩票中奖概率。\n' +
                    '真实彩票中奖概率极低，请务必理性对待。\n' +
                    '═══════════════════════════════'
                );
            }

            function confirmReturnToMenu() {
                if (gameState && !gameState.isGameOver) {
                    if (!confirm('确定要退出到主菜单吗？当前进度将丢失。')) return;
                }
                switchView('view-menu');
            }

            // ============================================
            // 导出全局函数
            // ============================================
            window.switchView = switchView;
            window.startGame = startGame;
            window.resetToStart = resetToStart;
            window.selectLotteryType = selectLotteryType;
            window.buyLottery = buyLottery;
            window.showAboutInfo = showAboutInfo;
            window.confirmReturnToMenu = confirmReturnToMenu;

            // ============================================
            // 初始化
            // ============================================
            function init() {
                updateHeaderInfo();
                switchView('view-menu');
                // 监听数量输入
                const qtyInput = $('quantity');
                if (qtyInput) {
                    qtyInput.addEventListener('change', function() {
                        let v = parseInt(this.value) || 1;
                        if (v < 1) v = 1;
                        if (v > 100) v = 100;
                        this.value = v;
                    });
                }
            }

            init();

        })();
    </script>
</body>
</html>
