<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>末日防空工厂 4.0 - 移动与视觉全面增强版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #090d16;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* 顶栏 Header */
        header {
            background: #1e293b;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .brand {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-bar {
            display: flex;
            gap: 12px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .stat-item {
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .gold { color: #facc15; }
        .hp { color: #f87171; }
        .wave { color: #38bdf8; }

        /* 主主体布局 (Desktop 3栏) */
        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            gap: 12px;
            padding: 12px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* 模块卡片 */
        .panel {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 升级项卡片 */
        .upgrade-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .upgrade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .upgrade-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        /* 通用按钮 */
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            min-height: 44px; /* 移动端触控优化 */
        }

        .btn:active {
            transform: scale(0.97);
            filter: brightness(1.2);
        }

        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .btn-warning { background: #d97706; }
        .btn-danger { background: #dc2626; }
        .btn-success { background: #16a34a; }

        /* 画布区 */
        .canvas-container {
            position: relative;
            background: #020617;
            border-radius: 12px;
            border: 1px solid #1e293b;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 320px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 战术日志 */
        .log-list {
            font-family: monospace;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 180px;
            overflow-y: auto;
        }

        .log-item {
            padding: 4px 6px;
            border-radius: 4px;
            background: #1e293b;
            color: #cbd5e1;
        }

        .log-danger { border-left: 3px solid #ef4444; }
        .log-success { border-left: 3px solid #22c55e; }
        .log-info { border-left: 3px solid #3b82f6; }

        /* 移动端 Tab 导航栏 (默认隐藏，手机端显示) */
        .mobile-tabs {
            display: none;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            padding: 6px 12px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            text-align: center;
        }

        .tab-btn.active {
            background: #2563eb;
            color: white;
            border-color: #3b82f6;
        }

        /* 移动端 Responsive 媒体查询 */
        @media (max-width: 768px) {
            .main-container {
                display: flex;
                flex-direction: column;
                padding: 8px;
                gap: 8px;
            }

            .canvas-container {
                height: 48vh;
                min-height: 280px;
            }

            .mobile-tabs {
                display: flex;
            }

            .panel {
                display: none; /* 移动端通过Tab显隐 */
            }

            .panel.active-tab {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 顶栏数据监控 -->
    <header>
        <div class="brand">
            🛡️ 导弹防御 4.0
        </div>
        <div class="stats-bar">
            <div class="stat-item gold">💰 <span id="val-gold">100</span></div>
            <div class="stat-item hp">❤️ <span id="val-hp">100</span>/100</div>
            <div class="stat-item wave">🌊 波次 <span id="val-wave">1</span></div>
        </div>
    </header>

    <!-- 主战场布局 -->
    <div class="main-container">

        <!-- 左侧：设施升级面板 -->
        <div class="panel" id="panel-upgrades">
            <div class="panel-title">🔧 设施与自动化升级</div>

            <div class="upgrade-card">
                <div class="upgrade-header">
                    <span>🚀 自动爱国者导弹发射井</span>
                    <span id="lvl-sam" style="color:#38bdf8;">Lv.1</span>
                </div>
                <div class="upgrade-desc">自动锁定高威胁导弹发射截击弹。</div>
                <button class="btn" id="btn-up-sam">升级 ($<span id="cost-sam">50</span>)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-header">
                    <span>🔫 近防炮火网 (CIWS)</span>
                    <span id="lvl-ciws" style="color:#38bdf8;">Lv.0</span>
                </div>
                <div class="upgrade-desc">对近距离敌弹发射密集曳光弹流。</div>
                <button class="btn" id="btn-up-ciws">解锁 ($<span id="cost-ciws">80</span>)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-header">
                    <span>📡 雷达识别矩阵</span>
                    <span id="lvl-radar" style="color:#38bdf8;">Lv.1</span>
                </div>
                <div class="upgrade-desc">提高锁定速度并提前预警隐形导弹。</div>
                <button class="btn" id="btn-up-radar">升级 ($<span id="cost-radar">40</span>)</button>
            </div>

            <div class="upgrade-card">
                <div class="upgrade-header">
                    <span>🏭 军工资金流水线</span>
                    <span id="lvl-income" style="color:#38bdf8;">Lv.1</span>
                </div>
                <div class="upgrade-desc">提高击毁敌弹奖励及每秒自动产金。</div>
                <button class="btn" id="btn-up-income">升级 ($<span id="cost-income">60</span>)</button>
            </div>
        </div>

        <!-- 中间：防空战场画布 -->
        <div class="canvas-container">
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- 右侧：手动战术控制 & 日志 -->
        <div class="panel" id="panel-tactics">
            <div class="panel-title">⚡ 战术指令</div>

            <button class="btn btn-warning" id="btn-flare">
                ✨ 手动诱饵热焰弹 (点击画面或按此)
            </button>

            <button class="btn btn-danger" id="btn-emp" disabled>
                💥 脉冲 EMP 冲击波 (冷却中: <span id="cd-emp">0</span>s)
            </button>

            <button class="btn btn-success" id="btn-repair">
                🛠️ 紧急修复基地高塔 ($<span id="cost-repair">50</span>)
            </button>

            <div class="panel-title" style="margin-top: 8px;">📜 战术日志</div>
            <div class="log-list" id="log-box">
                <div class="log-item log-info">>> 防空指挥系统已就位。</div>
                <div class="log-item log-info">>> 提示：在手机画面任意位置点击可释放热焰干扰弹。</div>
            </div>
        </div>

    </div>

    <!-- 移动端底部切换标签栏 -->
    <div class="mobile-tabs">
        <div class="tab-btn active" onclick="switchTab('upgrades')">🔧 设施升级</div>
        <div class="tab-btn" onclick="switchTab('tactics')">⚡ 战术指令</div>
    </div>

    <script>
        // --- 游戏全局状态 ---
        const state = {
            gold: 100,
            hp: 100,
            maxHp: 100,
            wave: 1,
            waveTimer: 0,
            enemies: [],
            interceptors: [],
            flares: [],
            particles: [],
            ciwsTracers: [], // CIWS 曳光弹视觉
            floatingTexts: [],
            samLvl: 1,
            ciwsLvl: 0,
            radarLvl: 1,
            incomeLvl: 1,
            samCooldown: 0,
            empCooldown: 0,
            empMaxCd: 15,
            ciwsCooldown: 0,
            destroyedCount: 0
        };

        // --- 画布及适配 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getWidth() { return container.getBoundingClientRect().width; }
        function getHeight() { return container.getBoundingClientRect().height; }

        // --- 日志系统 ---
        function addLog(msg, type = 'info') {
            const box = document.getElementById('log-box');
            const item = document.createElement('div');
            item.className = `log-item log-${type}`;
            item.innerText = `[${new Date().toLocaleTimeString().split(' ')[0]}] ${msg}`;
            box.appendChild(item);
            box.scrollTop = box.scrollHeight;
            if (box.children.length > 20) box.removeChild(box.firstChild);
        }

        // --- 浮动字体文本 (击杀提示 +15g) ---
        function spawnFloatingText(x, y, text, color = '#facc15') {
            state.floatingTexts.push({ x, y, text, color, alpha: 1.0, life: 40 });
        }

        // --- 爆炸粒子效果 (确保任何死亡均有爆炸) ---
        function createExplosion(x, y, color = '#f97316', count = 16) {
            // 冲击波环
            state.particles.push({
                x, y, radius: 2, maxRadius: 28, color: '#fef08a', alpha: 1.0, type: 'ring'
            });
            // 颗粒火花
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                state.particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 2.5 + 1,
                    color: color,
                    alpha: 1.0,
                    life: 25 + Math.random() * 15,
                    type: 'dot'
                });
            }
        }

        // --- 生成敌方导弹 ---
        function spawnEnemy() {
            const w = getWidth();
            const startX = Math.random() * (w - 60) + 30;
            const targetX = Math.random() * (w - 60) + 30;
            const targetY = getHeight() - 25;

            const r = Math.random();
            let type = 'normal';
            let hp = 1;
            let speed = 1.2 + state.wave * 0.12;
            let color = '#ef4444';
            let radius = 4;

            if (r < 0.25 && state.wave >= 2) {
                type = 'fast'; hp = 1; speed *= 1.8; color = '#f97316'; radius = 3.5;
            } else if (r < 0.45 && state.wave >= 3) {
                type = 'heavy'; hp = 4 + Math.floor(state.wave * 0.5); speed *= 0.7; color = '#a855f7'; radius = 6;
            } else if (r < 0.60 && state.wave >= 4) {
                type = 'stealth'; hp = 2; speed *= 1.1; color = '#06b6d4'; radius = 4;
            }

            const dx = targetX - startX;
            const dy = targetY - 0;
            const dist = Math.hypot(dx, dy);

            state.enemies.push({
                x: startX, y: 0,
                vx: (dx / dist) * speed,
                vy: (dy / dist) * speed,
                hp, maxHp: hp, type, color, radius,
                targetX, targetY,
                id: Math.random().toString(36).substring(2, 9)
            });
        }

        // --- 手动释放诱饵弹 ---
        function launchFlare(x, y) {
            state.flares.push({ x, y, radius: 3, maxRadius: 40, alpha: 1.0, life: 60 });
            createExplosion(x, y, '#38bdf8', 8);
        }

        // --- 输入事件处理 (手机触屏 / 鼠标) ---
        function handleCanvasPointer(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            launchFlare(clickX, clickY);
        }
        canvas.addEventListener('pointerdown', handleCanvasPointer);

        document.getElementById('btn-flare').addEventListener('click', () => {
            launchFlare(getWidth() / 2, getHeight() * 0.4);
        });

        document.getElementById('btn-emp').addEventListener('click', () => {
            if (state.empCooldown > 0) return;
            state.empCooldown = state.empMaxCd;
            addLog('💥 EMP 电磁脉冲释放！全屏敌弹受损！', 'danger');

            const h = getHeight();
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const e = state.enemies[i];
                e.hp -= 5;
                createExplosion(e.x, e.y, '#38bdf8', 10);
                if (e.hp <= 0) {
                    killEnemy(i, 'EMP冲击');
                }
            }
        });

        // 统一敌弹销毁函数，确保产生金币、浮动文字与爆炸
        function killEnemy(index, source = '') {
            const e = state.enemies[index];
            if (!e) return;
            const reward = 10 + state.incomeLvl * 3;
            state.gold += reward;
            state.destroyedCount++;
            spawnFloatingText(e.x, e.y, `+${reward}g`);
            createExplosion(e.x, e.y, e.color, 18);
            state.enemies.splice(index, 1);
        }

        // --- 升级按钮事件监听 ---
        document.getElementById('btn-up-sam').addEventListener('click', () => {
            const cost = 50 * state.samLvl;
            if (state.gold >= cost) {
                state.gold -= cost;
                state.samLvl++;
                addLog(`🚀 爱国者发射井升级至 Lv.${state.samLvl}`, 'success');
                updateUI();
            }
        });

        document.getElementById('btn-up-ciws').addEventListener('click', () => {
            const cost = state.ciwsLvl === 0 ? 80 : 70 * state.ciwsLvl;
            if (state.gold >= cost) {
                state.gold -= cost;
                state.ciwsLvl++;
                addLog(`🔫 近防炮 (CIWS) 升级至 Lv.${state.ciwsLvl}`, 'success');
                updateUI();
            }
        });

        document.getElementById('btn-up-radar').addEventListener('click', () => {
            const cost = 40 * state.radarLvl;
            if (state.gold >= cost) {
                state.gold -= cost;
                state.radarLvl++;
                addLog(`📡 雷达识别矩阵升级至 Lv.${state.radarLvl}`, 'success');
                updateUI();
            }
        });

        document.getElementById('btn-up-income').addEventListener('click', () => {
            const cost = 60 * state.incomeLvl;
            if (state.gold >= cost) {
                state.gold -= cost;
                state.incomeLvl++;
                addLog(`🏭 军工流水线升级至 Lv.${state.incomeLvl}`, 'success');
                updateUI();
            }
        });

        document.getElementById('btn-repair').addEventListener('click', () => {
            const cost = 50;
            if (state.gold >= cost && state.hp < state.maxHp) {
                state.gold -= cost;
                state.hp = Math.min(state.maxHp, state.hp + 30);
                addLog(`🛠️ 基地成功修复 30 HP！`, 'success');
                updateUI();
            }
        });

        // --- UI 数据同步 ---
        function updateUI() {
            document.getElementById('val-gold').innerText = Math.floor(state.gold);
            document.getElementById('val-hp').innerText = Math.max(0, Math.floor(state.hp));
            document.getElementById('val-wave').innerText = state.wave;

            document.getElementById('lvl-sam').innerText = `Lv.${state.samLvl}`;
            document.getElementById('cost-sam').innerText = 50 * state.samLvl;
            document.getElementById('btn-up-sam').disabled = state.gold < (50 * state.samLvl);

            document.getElementById('lvl-ciws').innerText = state.ciwsLvl === 0 ? '未解锁' : `Lv.${state.ciwsLvl}`;
            document.getElementById('cost-ciws').innerText = state.ciwsLvl === 0 ? 80 : 70 * state.ciwsLvl;
            document.getElementById('btn-up-ciws').innerText = state.ciwsLvl === 0 ? '解锁 ($80)' : `升级 ($${70 * state.ciwsLvl})`;
            document.getElementById('btn-up-ciws').disabled = state.gold < (state.ciwsLvl === 0 ? 80 : 70 * state.ciwsLvl);

            document.getElementById('lvl-radar').innerText = `Lv.${state.radarLvl}`;
            document.getElementById('cost-radar').innerText = 40 * state.radarLvl;
            document.getElementById('btn-up-radar').disabled = state.gold < (40 * state.radarLvl);

            document.getElementById('lvl-income').innerText = `Lv.${state.incomeLvl}`;
            document.getElementById('cost-income').innerText = 60 * state.incomeLvl;
            document.getElementById('btn-up-income').disabled = state.gold < (60 * state.incomeLvl);

            const empBtn = document.getElementById('btn-emp');
            if (state.empCooldown > 0) {
                empBtn.disabled = true;
                document.getElementById('cd-emp').innerText = Math.ceil(state.empCooldown);
            } else {
                empBtn.disabled = false;
                document.getElementById('cd-emp').innerText = '0';
            }
        }

        // --- 移动端 Tab 切换逻辑 ---
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-tab'));

            if (tabName === 'upgrades') {
                document.getElementById('panel-upgrades').classList.add('active-tab');
                event.currentTarget.classList.add('active');
            } else if (tabName === 'tactics') {
                document.getElementById('panel-tactics').classList.add('active-tab');
                event.currentTarget.classList.add('active');
            }
        }
        // 默认初始化移动端 Tab
        if (window.innerWidth <= 768) {
            document.getElementById('panel-upgrades').classList.add('active-tab');
        }

        // --- 主游戏循环 Game Loop ---
        let lastTime = performance.now();

        function gameLoop(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            const w = getWidth();
            const h = getHeight();

            // 1. 自动生成敌弹逻辑
            state.waveTimer += dt;
            if (state.waveTimer > Math.max(0.8, 3.5 - state.wave * 0.25)) {
                state.waveTimer = 0;
                spawnEnemy();
                if (Math.random() < 0.2) state.wave = Math.floor(state.destroyedCount / 12) + 1;
            }

            // 自动产金
            state.gold += dt * (1 + state.incomeLvl * 0.5);

            // 冷却缩减
            if (state.empCooldown > 0) state.empCooldown -= dt;

            // 2. 自动防空 SAM 导弹逻辑
            state.samCooldown -= dt;
            const samInterval = Math.max(0.4, 2.2 - state.samLvl * 0.25);
            if (state.samCooldown <= 0 && state.enemies.length > 0) {
                state.samCooldown = samInterval;
                // 优先锁定近地最高威胁
                let target = state.enemies.reduce((prev, curr) => (curr.y > prev.y ? curr : prev), state.enemies[0]);
                if (target) {
                    state.interceptors.push({
                        x: w / 2, y: h - 30,
                        targetId: target.id,
                        targetX: target.x, targetY: target.y,
                        speed: 4.5 + state.samLvl * 0.4,
                        radius: 3
                    });
                }
            }

            // 3. 自动近防炮 CIWS 拦截（新增：绘制明确的曳光弹弹道，防止敌弹“凭空消失”）
            if (state.ciwsLvl > 0 && state.enemies.length > 0) {
                state.ciwsCooldown -= dt;
                if (state.ciwsCooldown <= 0) {
                    state.ciwsCooldown = 0.12; // 极高频射速
                    // 寻找 180px 范围内的敌人
                    let closeEnemyIndex = state.enemies.findIndex(e => Math.hypot(e.x - w / 2, e.y - (h - 30)) < 220);
                    if (closeEnemyIndex !== -1) {
                        const target = state.enemies[closeEnemyIndex];
                        target.hp -= (0.8 + state.ciwsLvl * 0.5);

                        // 生成可见的 CIWS 曳光弹火线
                        state.ciwsTracers.push({
                            sx: w / 2, sy: h - 30,
                            tx: target.x + (Math.random() * 8 - 4),
                            ty: target.y + (Math.random() * 8 - 4),
                            life: 4
                        });

                        if (target.hp <= 0) {
                            killEnemy(closeEnemyIndex, 'CIWS近防炮');
                        }
                    }
                }
            }

            // 4. 更新拦截弹移动
            for (let i = state.interceptors.length - 1; i >= 0; i--) {
                const missile = state.interceptors[i];
                // 寻找目标或跟随坐标
                const target = state.enemies.find(e => e.id === missile.targetId);
                if (target) {
                    missile.targetX = target.x;
                    missile.targetY = target.y;
                }

                const dx = missile.targetX - missile.x;
                const dy = missile.targetY - missile.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 8) {
                    // 导弹到达目标点，触发范围拦截爆炸
                    createExplosion(missile.x, missile.y, '#38bdf8', 12);
                    for (let j = state.enemies.length - 1; j >= 0; j--) {
                        const e = state.enemies[j];
                        if (Math.hypot(e.x - missile.x, e.y - missile.y) < 32 + state.samLvl * 3) {
                            e.hp -= (2 + state.samLvl * 0.8);
                            if (e.hp <= 0) {
                                killEnemy(j, '爱国者截击');
                            }
                        }
                    }
                    state.interceptors.splice(i, 1);
                } else {
                    missile.x += (dx / dist) * missile.speed;
                    missile.y += (dy / dist) * missile.speed;
                }
            }

            // 5. 更新敌方导弹位置及碰撞
            for (let i = state.enemies.length - 1; i >= 0; i--) {
                const e = state.enemies[i];
                e.x += e.vx;
                e.y += e.vy;

                // 诱饵热焰弹吸引偏航
                for (let f of state.flares) {
                    if (Math.hypot(e.x - f.x, e.y - f.y) < f.radius + 20) {
                        e.vx += (f.x - e.x) * 0.02;
                        e.vy += (f.y - e.y) * 0.02;
                    }
                }

                // 检查击中地面/基地
                if (e.y >= h - 25) {
                    state.hp -= (e.type === 'heavy' ? 20 : 10);
                    createExplosion(e.x, h - 20, '#ef4444', 20);
                    addLog(`💥 基地遭受攻击！扣除生命值！`, 'danger');
                    state.enemies.splice(i, 1);
                    if (state.hp <= 0) {
                        alert(`⚠️ 基地已被摧毁！获得战绩：摧毁 ${state.destroyedCount} 枚导弹。点击确定重新开局。`);
                        location.reload();
                    }
                }
            }

            // 6. 渲染绘制 Canvas 画面
            ctx.clearRect(0, 0, w, h);

            // 背景星空网格
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (let x = 0; x < w; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
            for (let y = 0; y < h; y += 40) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
            ctx.stroke();

            // 绘制基地建筑与防空设施
            ctx.fillStyle = '#334155';
            ctx.fillRect(w / 2 - 40, h - 20, 80, 20);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(w / 2 - 6, h - 32, 12, 12); // 发射井

            // 绘制 CIWS 曳光弹火线
            for (let i = state.ciwsTracers.length - 1; i >= 0; i--) {
                const t = state.ciwsTracers[i];
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(t.sx, t.sy);
                ctx.lineTo(t.tx, t.ty);
                ctx.stroke();
                t.life--;
                if (t.life <= 0) state.ciwsTracers.splice(i, 1);
            }

            // 绘制敌方导弹及弹道尾迹
            for (let e of state.enemies) {
                // 尾烟
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(e.x - e.vx * 6, e.y - e.vy * 6);
                ctx.lineTo(e.x, e.y);
                ctx.stroke();

                // 导弹实体
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();

                // 隐形导弹光晕（保证视觉可见性）
                if (e.type === 'stealth') {
                    ctx.strokeStyle = '#06b6d4';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // 血条
                if (e.maxHp > 1) {
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(e.x - 10, e.y - 12, 20, 3);
                    ctx.fillStyle = '#22c55e';
                    ctx.fillRect(e.x - 10, e.y - 12, (e.hp / e.maxHp) * 20, 3);
                }
            }

            // 绘制拦截弹
            for (let m of state.interceptors) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - (m.targetX - m.x) * 0.1, m.y - (m.targetY - m.y) * 0.1);
                ctx.stroke();

                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // 绘制热焰干扰弹
            for (let i = state.flares.length - 1; i >= 0; i--) {
                const f = state.flares[i];
                ctx.strokeStyle = `rgba(56, 189, 248, ${f.alpha})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.stroke();

                f.radius += 0.8;
                f.alpha -= 0.015;
                if (f.alpha <= 0) state.flares.splice(i, 1);
            }

            // 绘制粒子爆炸
            for (let i = state.particles.length - 1; i >= 0; i--) {
                const p = state.particles[i];
                if (p.type === 'ring') {
                    ctx.strokeStyle = `rgba(254, 240, 138, ${p.alpha})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.stroke();
                    p.radius += 1.2;
                    p.alpha -= 0.04;
                    if (p.alpha <= 0) state.particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    if (p.life <= 0) state.particles.splice(i, 1);
                }
            }

            // 绘制浮动获金提示 (+15g)
            for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
                const ft = state.floatingTexts[i];
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 12px sans-serif';
                ctx.fillText(ft.text, ft.x - 10, ft.y);
                ft.y -= 0.6;
                ft.life--;
                if (ft.life <= 0) state.floatingTexts.splice(i, 1);
            }

            updateUI();
            requestAnimationFrame(gameLoop);
        }

        // 启动主循环
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
