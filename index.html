<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>动车组接线员</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: #080c1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* 禁止滚动，全屏沉浸 */
        }

        /* ===== 背景层 ===== */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 180, 255, 0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 20%, rgba(120, 50, 255, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(255, 40, 150, 0.10) 0%, transparent 45%),
                radial-gradient(ellipse at 10% 90%, rgba(0, 200, 255, 0.08) 0%, transparent 40%),
                linear-gradient(145deg, #080c1a 0%, #0d1a2e 40%, #120b24 100%);
            overflow: hidden;
        }

        /* 背景动态光晕 */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            pointer-events: none;
        }
        .bg-glow.g1 {
            width: 60vw;
            height: 60vw;
            top: -20%;
            left: -10%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.25), transparent 70%);
            animation: floatGlow 12s ease-in-out infinite alternate;
        }
        .bg-glow.g2 {
            width: 50vw;
            height: 50vw;
            bottom: -15%;
            right: -8%;
            background: radial-gradient(circle, rgba(130, 60, 255, 0.20), transparent 70%);
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
        }
        .bg-glow.g3 {
            width: 40vw;
            height: 40vw;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(0, 200, 255, 0.08), transparent 70%);
            animation: floatGlow 18s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* 背景轨道装饰线 - 速度感 */
        .track-lines {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .track-line {
            position: absolute;
            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.10), rgba(100, 200, 255, 0.25), rgba(100, 200, 255, 0.10), transparent);
            border-radius: 2px;
            animation: trackMove linear infinite;
        }
        .track-line:nth-child(1) {
            width: 70%;
            left: -10%;
            bottom: 12%;
            animation-duration: 8s;
            opacity: 0.4;
        }
        .track-line:nth-child(2) {
            width: 50%;
            left: 30%;
            bottom: 20%;
            animation-duration: 12s;
            opacity: 0.3;
            animation-delay: -3s;
            height: 1px;
        }
        .track-line:nth-child(3) {
            width: 80%;
            left: -20%;
            bottom: 5%;
            animation-duration: 10s;
            opacity: 0.25;
            animation-delay: -5s;
            height: 1.5px;
        }
        .track-line:nth-child(4) {
            width: 40%;
            left: 50%;
            bottom: 28%;
            animation-duration: 14s;
            opacity: 0.2;
            animation-delay: -7s;
            height: 1px;
        }

        @keyframes trackMove {
            0% {
                transform: translateX(0) scaleX(1);
                opacity: 0.1;
            }
            20% {
                opacity: 0.4;
            }
            80% {
                opacity: 0.4;
            }
            100% {
                transform: translateX(120%) scaleX(0.8);
                opacity: 0;
            }
        }

        /* 背景小光点 (星星/信号灯) */
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .sparkle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: sparkleAnim 4s ease-in-out infinite;
        }
        .sparkle:nth-child(1) {
            top: 15%;
            left: 10%;
            animation-delay: 0.2s;
            width: 4px;
            height: 4px;
            background: rgba(100, 200, 255, 0.6);
        }
        .sparkle:nth-child(2) {
            top: 25%;
            right: 18%;
            animation-delay: 1.0s;
            background: rgba(200, 150, 255, 0.5);
        }
        .sparkle:nth-child(3) {
            top: 60%;
            left: 5%;
            animation-delay: 2.2s;
            width: 2px;
            height: 2px;
            background: rgba(100, 200, 255, 0.4);
        }
        .sparkle:nth-child(4) {
            top: 70%;
            right: 10%;
            animation-delay: 0.8s;
            width: 5px;
            height: 5px;
            background: rgba(200, 180, 255, 0.3);
        }
        .sparkle:nth-child(5) {
            top: 40%;
            left: 45%;
            animation-delay: 3.0s;
            width: 3px;
            height: 3px;
            background: rgba(0, 200, 255, 0.5);
        }
        .sparkle:nth-child(6) {
            top: 85%;
            left: 30%;
            animation-delay: 1.5s;
            background: rgba(255, 200, 100, 0.3);
        }
        .sparkle:nth-child(7) {
            top: 10%;
            left: 55%;
            animation-delay: 2.8s;
            width: 2px;
            height: 2px;
            background: rgba(150, 200, 255, 0.4);
        }
        .sparkle:nth-child(8) {
            top: 50%;
            left: 75%;
            animation-delay: 0.5s;
            background: rgba(200, 100, 255, 0.3);
        }

        @keyframes sparkleAnim {
            0%,
            100% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== 玻璃卡片 ===== */
        .glass-card {
            position: relative;
            width: 100%;
            padding: 40px 32px 36px;
            background: rgba(255, 255, 255, 0.045);
            backdrop-filter: blur(28px) saturate(1.2);
            -webkit-backdrop-filter: blur(28px) saturate(1.2);
            border-radius: 36px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 8px 32px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.5s ease;
            animation: cardFloat 6s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-8px);
            }
        }

        /* 固态高光 — 顶部/左侧高光条 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.60), rgba(255, 255, 255, 0.80), rgba(255, 255, 255, 0.60), transparent);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.9;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0%, transparent 100%);
            border-radius: 28px 28px 50% 50%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 卡片的侧边高光 (左侧边缘) */
        .glass-card .edge-highlight {
            position: absolute;
            top: 12%;
            left: -1.5px;
            width: 3px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35), rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.35));
            border-radius: 3px;
            opacity: 0.5;
            filter: blur(0.5px);
        }

        /* ===== 卡片内容 ===== */
        .card-content {
            position: relative;
            z-index: 2;
        }

        /* 图标区域 */
        .game-icon {
            font-size: 52px;
            line-height: 1;
            margin-bottom: 6px;
            display: inline-block;
            filter: drop-shadow(0 4px 20px rgba(0, 150, 255, 0.25));
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1) rotate(0deg);
            }
            50% {
                transform: scale(1.05) rotate(-2deg);
            }
        }

        /* 装饰小信号灯 */
        .signal-lights {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .signal-light {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            transition: all 0.3s;
        }
        .signal-light.s1 {
            background: radial-gradient(circle at 35% 35%, #ff6b6b, #cc0000);
            animation: signalBlink 2s ease-in-out infinite;
            box-shadow: 0 0 16px rgba(255, 0, 0, 0.30);
        }
        .signal-light.s2 {
            background: radial-gradient(circle at 35% 35%, #ffd93d, #cc9900);
            animation: signalBlink 2.4s ease-in-out infinite 0.6s;
            box-shadow: 0 0 16px rgba(255, 200, 0, 0.25);
        }
        .signal-light.s3 {
            background: radial-gradient(circle at 35% 35%, #6bcb6b, #009900);
            animation: signalBlink 2.8s ease-in-out infinite 1.2s;
            box-shadow: 0 0 16px rgba(0, 200, 0, 0.25);
        }

        @keyframes signalBlink {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* 主标题 - 光泽文字 */
        .main-title {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a8d8ff 40%, #ffffff 70%, #c8e6ff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            filter: drop-shadow(0 2px 20px rgba(0, 150, 255, 0.20));
            animation: titleShine 6s ease-in-out infinite alternate;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        @keyframes titleShine {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* 副标题 */
        .sub-title {
            font-size: 14px;
            letter-spacing: 8px;
            color: rgba(180, 215, 255, 0.60);
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 24px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.30);
            font-family: "Helvetica Neue", Arial, sans-serif;
        }
        .sub-title span {
            display: inline-block;
            animation: subtitleFade 4s ease-in-out infinite alternate;
        }
        @keyframes subtitleFade {
            0% {
                opacity: 0.5;
                letter-spacing: 6px;
            }
            100% {
                opacity: 1;
                letter-spacing: 10px;
            }
        }

        /* 分隔装饰 */
        .divider {
            width: 60px;
            height: 2px;
            margin: 16px auto 22px;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.40), rgba(180, 150, 255, 0.40), transparent);
            border-radius: 2px;
            position: relative;
        }
        .divider::after {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.30), transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* 描述文字 */
        .description {
            font-size: 15px;
            color: rgba(200, 225, 255, 0.60);
            line-height: 1.7;
            font-weight: 300;
            max-width: 320px;
            margin: 0 auto 30px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
        }

        /* ===== 开始按钮 (玻璃态) ===== */
        .btn-start {
            position: relative;
            display: inline-block;
            padding: 16px 52px;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1.5px solid rgba(255, 255, 255, 0.20);
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.30),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 60px;
            min-width: 200px;
            overflow: hidden;
        }
        /* 按钮高光 */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 10%;
            width: 80%;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.4s;
        }
        .btn-start::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .btn-start:hover {
            transform: translateY(-2px) scale(1.02);
            background: rgba(255, 255, 255, 0.10);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow:
                0 16px 48px rgba(0, 100, 255, 0.25),
                0 8px 24px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.40);
        }
        .btn-start:hover::after {
            opacity: 1;
        }
        .btn-start:hover::before {
            opacity: 0.9;
        }

        .btn-start:active {
            transform: translateY(0px) scale(0.97);
            background: rgba(255, 255, 255, 0.04);
            box-shadow:
                0 4px 16px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
            transition-duration: 0.08s;
        }

        /* 按钮内的箭头 */
        .btn-start .arrow {
            display: inline-block;
            margin-left: 10px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-start:hover .arrow {
            transform: translateX(6px) scale(1.1);
        }

        /* 按钮闪烁光晕 (鼠标不动时也有微弱呼吸) */
        .btn-start .pulse-ring {
            position: absolute;
            inset: -4px;
            border-radius: 64px;
            border: 1.5px solid rgba(100, 200, 255, 0.10);
            animation: btnPulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes btnPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.04);
                opacity: 0.8;
            }
        }

        /* ===== 版本信息 ===== */
        .version-info {
            margin-top: 28px;
            font-size: 12px;
            color: rgba(180, 210, 255, 0.25);
            letter-spacing: 2px;
            font-weight: 300;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .version-info .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(180, 210, 255, 0.20);
            display: inline-block;
        }
        .version-info span {
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .version-info span:hover {
            opacity: 1;
        }

        /* ===== 响应式 ===== */

        /* 平板 & 小屏笔记本 */
        @media (max-width: 768px) {
            .main-container {
                padding: 16px;
                max-width: 480px;
            }
            .glass-card {
                padding: 32px 24px 28px;
                border-radius: 28px;
            }
            .main-title {
                font-size: 34px;
                letter-spacing: 3px;
            }
            .sub-title {
                font-size: 12px;
                letter-spacing: 6px;
            }
            .game-icon {
                font-size: 44px;
            }
            .btn-start {
                padding: 14px 40px;
                font-size: 18px;
                min-height: 54px;
                min-width: 170px;
            }
            .description {
                font-size: 14px;
                max-width: 280px;
            }
        }

        /* 手机 (小屏) */
        @media (max-width: 480px) {
            .main-container {
                padding: 12px;
                max-width: 100%;
            }
            .glass-card {
                padding: 26px 18px 22px;
                border-radius: 24px;
                border-width: 1px;
                box-shadow:
                    0 20px 60px rgba(0, 0, 0, 0.50),
                    0 4px 20px rgba(0, 0, 0, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.20);
            }
            .glass-card::before {
                left: 15%;
                width: 70%;
                height: 2.5px;
            }
            .glass-card::after {
                top: 6px;
                left: 6px;
                right: 6px;
                height: 35%;
            }

            .main-title {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .sub-title {
                font-size: 10px;
                letter-spacing: 5px;
                margin-bottom: 16px;
            }
            .sub-title span {
                animation: none;
            }
            .game-icon {
                font-size: 38px;
                margin-bottom: 2px;
            }
            .signal-lights {
                gap: 8px;
                margin-bottom: 10px;
            }
            .signal-light {
                width: 8px;
                height: 8px;
            }
            .divider {
                width: 44px;
                margin: 10px auto 16px;
            }
            .description {
                font-size: 13px;
                max-width: 240px;
                margin-bottom: 22px;
                line-height: 1.6;
            }
            .btn-start {
                padding: 12px 32px;
                font-size: 16px;
                min-height: 48px;
                min-width: 150px;
                letter-spacing: 2px;
                border-radius: 50px;
            }
            .btn-start .arrow {
                margin-left: 6px;
            }
            .btn-start .pulse-ring {
                display: none;
            }
            .version-info {
                font-size: 10px;
                margin-top: 20px;
                gap: 10px;
            }
            .version-info .dot {
                width: 2px;
                height: 2px;
            }
            .glass-card .edge-highlight {
                display: none;
            }
            /* 手机去掉浮动动画，更稳定 */
            .glass-card {
                animation: none;
            }
            .bg-glow {
                filter: blur(60px);
            }
            .bg-glow.g1 {
                width: 80vw;
                height: 80vw;
                top: -30%;
                left: -20%;
            }
            .bg-glow.g2 {
                width: 70vw;
                height: 70vw;
                bottom: -20%;
                right: -15%;
            }
            .track-line {
                display: none;
            }
            .sparkle {
                display: none;
            }
        }

        /* 超大屏优化 */
        @media (min-width: 1200px) {
            .main-container {
                max-width: 640px;
            }
            .glass-card {
                padding: 52px 44px 44px;
                border-radius: 44px;
            }
            .main-title {
                font-size: 50px;
                letter-spacing: 6px;
            }
            .sub-title {
                font-size: 16px;
                letter-spacing: 12px;
            }
            .game-icon {
                font-size: 64px;
            }
            .btn-start {
                padding: 20px 64px;
                font-size: 22px;
                min-height: 68px;
                min-width: 240px;
            }
            .description {
                font-size: 16px;
                max-width: 380px;
            }
        }

        /* 横屏手机提示 (可选) */
        @media (max-height: 500px) and (orientation: landscape) {
            .main-container {
                min-height: 100vh;
                padding: 10px 20px;
            }
            .glass-card {
                padding: 18px 24px 16px;
                border-radius: 20px;
                max-width: 500px;
            }
            .main-title {
                font-size: 26px;
                letter-spacing: 2px;
            }
            .game-icon {
                font-size: 30px;
                margin-bottom: 0;
            }
            .signal-lights {
                margin-bottom: 6px;
                gap: 6px;
            }
            .signal-light {
                width: 6px;
                height: 6px;
            }
            .sub-title {
                font-size: 10px;
                margin-bottom: 10px;
                letter-spacing: 4px;
            }
            .divider {
                margin: 8px auto 12px;
                width: 36px;
            }
            .description {
                font-size: 12px;
                margin-bottom: 14px;
                max-width: 220px;
            }
            .btn-start {
                padding: 10px 28px;
                font-size: 14px;
                min-height: 40px;
                min-width: 120px;
            }
            .version-info {
                margin-top: 12px;
                font-size: 9px;
            }
            .glass-card::before,
            .glass-card::after {
                display: none;
            }
            .glass-card .edge-highlight {
                display: none;
            }
            .bg-glow {
                display: none;
            }
            .track-line {
                display: none;
            }
            .sparkle {
                display: none;
            }
        }

        /* 禁用点击选中 */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* 按钮点击波纹 (简单反馈) */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景层 ===== -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-glow g1"></div>
        <div class="bg-glow g2"></div>
        <div class="bg-glow g3"></div>

        <div class="track-lines">
            <div class="track-line"></div>
            <div class="track-line"></div>
            <div class="track-line"></div>
            <div class="track-line"></div>
        </div>

        <div class="sparkles">
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
            <div class="sparkle"></div>
        </div>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="main-container">
        <div class="glass-card" role="main" aria-label="游戏开始封面">

            <!-- 边缘高光装饰 -->
            <div class="edge-highlight"></div>

            <div class="card-content">

                <!-- 信号灯 -->
                <div class="signal-lights" aria-hidden="true">
                    <span class="signal-light s1"></span>
                    <span class="signal-light s2"></span>
                    <span class="signal-light s3"></span>
                </div>

                <!-- 图标 -->
                <div class="game-icon" aria-hidden="true">🚄</div>

                <!-- 主标题 -->
                <h1 class="main-title">动车组接线员</h1>

                <!-- 副标题 -->
                <div class="sub-title">
                    <span>Train Dispatcher</span>
                </div>

                <!-- 分隔线 -->
                <div class="divider" aria-hidden="true"></div>

                <!-- 描述 -->
                <p class="description">
                    调度列车 · 指挥线路 · 保障安全
                </p>

                <!-- 开始按钮 -->
                <button class="btn-start" id="btnStart" aria-label="开始游戏">
                    <span class="pulse-ring"></span>
                    开始游戏
                    <span class="arrow">→</span>
                </button>

                <!-- 版本信息 -->
                <div class="version-info">
                    <span>v1.0.0</span>
                    <span class="dot"></span>
                    <span>⚡ 模拟铁路</span>
                    <span class="dot"></span>
                    <span>2026</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('btnStart');

            // ===== 按钮点击反馈 + 游戏入口 =====
            btn.addEventListener('click', function(e) {
                // 创建水波纹 (仅在按钮内)
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 0.6;
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);

                // 动画结束后移除
                setTimeout(function() {
                    if (ripple.parentNode) ripple.remove();
                }, 700);

                // 按钮反馈: 文字变化 (瞬态)
                const originalText = btn.innerHTML;
                btn.innerHTML = '⏳ 启动中…';
                btn.disabled = true;
                btn.style.opacity = '0.85';

                // 模拟加载 (之后可替换为真正的游戏启动)
                setTimeout(function() {
                    // 恢复按钮 (演示)
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';

                    // 弹出游戏入口提示 (后续可替换为跳转)
                    // 使用更友好的提示，替代 alert
                    showGamePrompt('🚄 动车组接线员', '游戏引擎加载中…\n列车已就绪，即将发车！');

                }, 1200);
            });

            // ===== 自定义轻提示 (替代alert) =====
            function showGamePrompt(title, message) {
                // 移除已有提示
                const oldPrompt = document.querySelector('.game-prompt-overlay');
                if (oldPrompt) oldPrompt.remove();

                const overlay = document.createElement('div');
                overlay.className = 'game-prompt-overlay';
                overlay.style.cssText = `
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            z-index: 9999;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            background: rgba(0,0,0,0.55);
                            backdrop-filter: blur(12px);
                            -webkit-backdrop-filter: blur(12px);
                            animation: fadeInPrompt 0.3s ease;
                            padding: 20px;
                        `;

                const box = document.createElement('div');
                box.style.cssText = `
                            max-width: 400px;
                            width: 100%;
                            background: rgba(255,255,255,0.06);
                            backdrop-filter: blur(20px);
                            -webkit-backdrop-filter: blur(20px);
                            border: 1px solid rgba(255,255,255,0.12);
                            border-radius: 28px;
                            padding: 36px 28px 32px;
                            text-align: center;
                            box-shadow: 0 30px 80px rgba(0,0,0,0.50);
                            animation: slideUpPrompt 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                        `;

                box.innerHTML = `
                            <div style="font-size:48px;margin-bottom:8px;">🚄</div>
                            <h2 style="font-size:24px;font-weight:600;color:#ffffff;margin-bottom:8px;letter-spacing:2px;">${title}</h2>
                            <p style="font-size:16px;color:rgba(200,225,255,0.70);line-height:1.7;margin-bottom:24px;white-space:pre-line;">${message}</p>
                            <button id="promptCloseBtn" style="
                                padding:12px 40px;
                                font-size:16px;
                                font-weight:500;
                                color:#ffffff;
                                background:rgba(255,255,255,0.08);
                                backdrop-filter:blur(8px);
                                -webkit-backdrop-filter:blur(8px);
                                border:1px solid rgba(255,255,255,0.18);
                                border-radius:50px;
                                cursor:pointer;
                                transition:all 0.3s;
                                letter-spacing:2px;
                                box-shadow:0 8px 24px rgba(0,0,0,0.20);
                            ">我知道了</button>
                        `;

                overlay.appendChild(box);
                document.body.appendChild(overlay);

                // 添加样式动画
                const style = document.createElement('style');
                style.textContent = `
                            @keyframes fadeInPrompt {
                                from { opacity: 0; }
                                to { opacity: 1; }
                            }
                            @keyframes slideUpPrompt {
                                from { opacity: 0; transform: translateY(30px) scale(0.96); }
                                to { opacity: 1; transform: translateY(0) scale(1); }
                            }
                            #promptCloseBtn:hover {
                                background: rgba(255,255,255,0.15);
                                border-color: rgba(255,255,255,0.35);
                                transform: scale(1.02);
                            }
                            #promptCloseBtn:active {
                                transform: scale(0.97);
                            }
                            @media (max-width:480px) {
                                .game-prompt-overlay { padding: 12px; }
                                .game-prompt-overlay div { padding: 28px 18px 24px; border-radius: 22px; }
                                .game-prompt-overlay h2 { font-size:20px; }
                                .game-prompt-overlay p { font-size:14px; }
                                .game-prompt-overlay button { padding:10px 30px; font-size:14px; }
                            }
                        `;
                document.head.appendChild(style);

                // 关闭按钮
                const closeBtn = box.querySelector('#promptCloseBtn');
                closeBtn.addEventListener('click', function() {
                    overlay.remove();
                    style.remove();
                });

                // 点击背景关闭
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) {
                        overlay.remove();
                        style.remove();
                    }
                });

                // 键盘 ESC 关闭
                const escHandler = function(e) {
                    if (e.key === 'Escape') {
                        overlay.remove();
                        style.remove();
                        document.removeEventListener('keydown', escHandler);
                    }
                };
                document.addEventListener('keydown', escHandler);
            }

            // ===== 键盘快捷键 (回车/空格触发按钮) =====
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    if (document.activeElement === btn || document.activeElement === document.body) {
                        e.preventDefault();
                        btn.click();
                    }
                }
            });

            // ===== 移动端触摸优化: 防止双击缩放干扰 =====
            document.addEventListener('touchend', function(e) {
                // 无额外操作，保留
            }, { passive: true });

            console.log('🚄 动车组接线员 · 开始封面已加载');
            console.log('💡 点击 "开始游戏" 或按 Enter/Space 启动');

        })();
    </script>

</body>
</html>
