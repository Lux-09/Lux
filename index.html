<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">


<title>动车组接线员</title>


<style>


/* =========================
   基础设置
========================= */


*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:

"Microsoft YaHei",
"PingFang SC",
Arial,
sans-serif;

}


html,
body{


width:100%;
height:100%;


overflow:hidden;


background:#000;


}




/* =========================
   游戏主屏幕
========================= */


.game-screen{


width:100vw;

height:100vh;


position:relative;


display:flex;

justify-content:center;

align-items:center;



background:


linear-gradient(

135deg,

#06101d,

#16466e,

#06101d

);



overflow:hidden;


}





/* 背景光效 */


.light{


position:absolute;


width:90vw;

height:90vw;


background:


radial-gradient(

circle,

rgba(255,255,255,.28),

transparent 70%

);



filter:blur(60px);


animation:

lightMove 10s infinite alternate;


}





@keyframes lightMove{


from{

transform:

translate(-15%,-10%);

}


to{

transform:

translate(15%,10%);

}


}





/* =========================
玻璃主容器
========================= */


.glass-panel{


width:90%;


height:80%;


max-width:900px;



position:relative;



background:


linear-gradient(

145deg,

rgba(255,255,255,.35),

rgba(255,255,255,.08)

);



border:


1px solid

rgba(255,255,255,.45);



border-radius:


45px;



backdrop-filter:

blur(30px);


-webkit-backdrop-filter:

blur(30px);




box-shadow:


0 40px 100px

rgba(0,0,0,.5),



inset

0 0 50px

rgba(255,255,255,.25);



overflow:hidden;


}





/* 顶部玻璃反光 */


.glass-panel::before{


content:"";


position:absolute;


width:150%;


height:40%;


top:-25%;


left:-20%;



background:


linear-gradient(

transparent,

rgba(255,255,255,.35)

);



transform:

rotate(-15deg);



pointer-events:none;


}





/* =========================
页面系统
========================= */


.page{


position:absolute;


width:100%;

height:100%;



display:flex;


flex-direction:column;


justify-content:center;


align-items:center;



transition:.3s;


}




.login-page{


display:none;


}





/* =========================
标题
========================= */


.title{


font-size:


clamp(40px,7vw,85px);



letter-spacing:


10px;



color:white;



text-align:center;



text-shadow:


0 15px 40px

rgba(0,0,0,.6);



z-index:2;


}





.subtitle{


margin-top:25px;


font-size:


clamp(14px,2vw,24px);



letter-spacing:


6px;



color:white;


opacity:.8;



z-index:2;


}





/* =========================
按钮
========================= */


button{


cursor:pointer;


}





.start-btn,


.login-btn{


margin-top:60px;



width:


clamp(220px,40vw,360px);



height:70px;



border-radius:


50px;




border:


1px solid

rgba(255,255,255,.7);





background:


rgba(255,255,255,.18);



color:white;



font-size:24px;



letter-spacing:8px;



backdrop-filter:

blur(15px);



box-shadow:


0 20px 40px

rgba(0,0,0,.35),



inset

0 0 20px

rgba(255,255,255,.4);



transition:.3s;


}



.start-btn:hover,

.login-btn:hover{


transform:scale(1.08);


}





/* =========================
登录界面
========================= */


.login-title{


font-size:


clamp(30px,5vw,50px);



color:white;



letter-spacing:8px;



}




.input{


margin-top:40px;



width:


70%;



max-width:400px;



height:60px;



border-radius:40px;



border:


1px solid

rgba(255,255,255,.6);



background:


rgba(255,255,255,.15);



outline:none;



padding-left:30px;



font-size:20px;



color:white;



backdrop-filter:

blur(15px);


}




.input::placeholder{


color:

rgba(255,255,255,.7);


}





.back-btn{


margin-top:25px;



border:none;



background:none;



color:white;



font-size:16px;



opacity:.7;


}





/* =========================
版本信息
========================= */


.version{


position:absolute;



bottom:25px;



color:white;



font-size:14px;



opacity:.65;



}





/* =========================
游戏弹窗
========================= */


.notice-layer{


display:none;


position:fixed;



top:0;

left:0;



width:100vw;

height:100vh;



background:

rgba(0,0,0,.35);



justify-content:center;

align-items:center;



z-index:100;


}





.notice-box{


width:320px;



min-height:130px;



padding:35px;



border-radius:35px;



background:


linear-gradient(

145deg,

rgba(255,255,255,.45),

rgba(255,255,255,.12)

);



border:


1px solid

rgba(255,255,255,.6);



backdrop-filter:

blur(25px);



box-shadow:


0 30px 70px

rgba(0,0,0,.5);



color:white;



font-size:22px;



text-align:center;



letter-spacing:3px;


}





/* =========================
手机适配
========================= */


@media(max-width:600px){



.glass-panel{


width:92%;


height:85%;



border-radius:30px;


}



.input{


width:85%;


}



.start-btn,

.login-btn{


height:60px;


font-size:20px;


}



}



</style>


</head>



<body>



<div class="game-screen">



<div class="light"></div>



<div class="glass-panel">





<!-- ======================
启动页面
====================== -->


<div class="page start-page"
id="startPage">


<div class="title">

动车组接线员

</div>



<div class="subtitle">

HIGH SPEED TRAIN OPERATOR

</div>



<button

class="start-btn"

onclick="openLogin()">


开始运行


</button>


</div>







<!-- ======================
登录页面
====================== -->


<div class="page login-page"

id="loginPage">


<div class="login-title">


操作员登录


</div>




<input

id="account"

class="input"

placeholder="请输入操作员编号">





<button

class="login-btn"

onclick="login()">



进入系统



</button>




<button

class="back-btn"

onclick="backHome()">



返回首页



</button>



</div>






<div class="version">


内测版本01


</div>



</div>








<!-- ======================
游戏提示窗口
====================== -->


<div class="notice-layer"

id="notice">


<div class="notice-box"

id="noticeText">


提示


</div>


</div>







<script>



/*
=================================

账号管理区域

以后增加账号：

{
account:"新账号"
}


删除账号：

直接删除对应项目


=================================
*/


let accounts=[


{

account:"admin"

},



{

account:"operator001"

},



{

account:"tester01"

}



];







// 打开登录

function openLogin(){



document

.getElementById("startPage")

.style.display="none";



document

.getElementById("loginPage")

.style.display="flex";


}






// 返回首页


function backHome(){


document

.getElementById("loginPage")

.style.display="none";



document

.getElementById("startPage")

.style.display="flex";


}








// 登录验证


function login(){



let user=


document

.getElementById("account")

.value

.trim();




let check=


accounts.find(

item=>

item.account===user

);





if(check){



showNotice(

"登录成功<br>正在进入系统"

);




setTimeout(()=>{


/*

正式版本：

location.href="main.html";


*/


},1500);



}

else{



showNotice(

"操作员编号错误<br>请重新输入"

);



}



}








// 游戏内弹窗


function showNotice(message){



let box=

document.getElementById("notice");



document

.getElementById("noticeText")

.innerHTML=

message;



box.style.display="flex";





setTimeout(()=>{


box.style.display="none";


},2000);



}




</script>



</body>


</html>
