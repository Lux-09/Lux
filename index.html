<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>欢迎游玩作者Lux的游戏</title>
    <style>
        /* ===== 重置 & 基础 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
            background: #0b0e1a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== 背景层 ===== */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background:
                radial-gradient(ellipse at 30% 40%, rgba(40, 80, 200, 0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 70%, rgba(160, 80, 255, 0.20) 0%, transparent 50%),
                radial-gradient(ellipse at 10% 80%, rgba(0, 200, 255, 0.10) 0%, transparent 40%),
                linear-gradient(145deg, #0a0d1a 0%, #111b33 50%, #0e1025 100%);
        }

        /* 动态光晕 */
        .bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            pointer-events: none;
        }
        .bg-glow.g1 {
            width: 70vw;
            height: 70vw;
            top: -20%;
            left: -15%;
            background: radial-gradient(circle, rgba(60, 120, 255, 0.25), transparent 70%);
            animation: floatGlow 14s ease-in-out infinite alternate;
        }
        .bg-glow.g2 {
            width: 60vw;
            height: 60vw;
            bottom: -20%;
            right: -10%;
            background: radial-gradient(circle, rgba(180, 80, 255, 0.20), transparent 70%);
            animation: floatGlow 18s ease-in-out infinite alternate-reverse;
        }
        @keyframes floatGlow {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(30px, -20px) scale(1.1);
            }
        }

        /* 细微装饰粒子 */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: particleFloat 8s infinite alternate ease-in-out;
        }
        .particle:nth-child(1) {
            top: 12%;
            left: 8%;
            animation-delay: 0s;
        }
        .particle:nth-child(2) {
            top: 30%;
            right: 15%;
            animation-delay: 2s;
            width: 2px;
            height: 2px;
        }
        .particle:nth-child(3) {
            top: 70%;
            left: 5%;
            animation-delay: 4s;
            background: rgba(100, 200, 255, 0.20);
        }
        .particle:nth-child(4) {
            top: 80%;
            right: 8%;
            animation-delay: 1s;
            width: 4px;
            height: 4px;
        }
        .particle:nth-child(5) {
            top: 45%;
            left: 50%;
            animation-delay: 3s;
            width: 2px;
            height: 2px;
            background: rgba(200, 180, 255, 0.20);
        }
        @keyframes particleFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.2;
            }
            100% {
                transform: translateY(-30px) scale(1.5);
                opacity: 0.8;
            }
        }

        /* ===== 主容器 ===== */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* ===== 玻璃卡片 ===== */
        .glass-card {
            position: relative;
            width: 100%;
            padding: 44px 36px 38px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(32px) saturate(1.3);
            -webkit-backdrop-filter: blur(32px) saturate(1.3);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 40px 100px rgba(0, 0, 0, 0.60),
                0 8px 32px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.20),
                inset 0 -1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.5s ease;
            animation: cardFloat 8s ease-in-out infinite alternate;
        }

        @keyframes cardFloat {
            0% {
                transform: translateY(0px);
            }
            100% {
                transform: translateY(-10px);
            }
        }

        /* 顶部高光线条 */
        .glass-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 15%;
            width: 70%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.50), rgba(255, 255, 255, 0.70), rgba(255, 255, 255, 0.50), transparent);
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0.8;
        }

        /* 顶部内阴影高光 */
        .glass-card::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 10px;
            right: 10px;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, transparent 100%);
            border-radius: 30px 30px 50% 50%;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 侧边高光 */
        .side-highlight {
            position: absolute;
            top: 15%;
            left: -1px;
            width: 2.5px;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.30));
            border-radius: 3px;
            opacity: 0.4;
            filter: blur(0.5px);
        }

        /* ===== 内容 ===== */
        .card-content {
            position: relative;
            z-index: 2;
        }

        /* 信号灯（纯CSS） */
        .signal-lights {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 18px;
        }
        .signal-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.10);
            transition: all 0.3s;
        }
        .signal-light.s1 {
            background: radial-gradient(circle at 30% 30%, #ff7b7b, #cc2222);
            animation: blinkLight 2.2s ease-in-out infinite;
            box-shadow: 0 0 24px rgba(255, 60, 60, 0.30);
        }
        .signal-light.s2 {
            background: radial-gradient(circle at 30% 30%, #ffd966, #d4a000);
            animation: blinkLight 2.8s ease-in-out infinite 0.6s;
            box-shadow: 0 0 24px rgba(255, 200, 0, 0.25);
        }
        .signal-light.s3 {
            background: radial-gradient(circle at 30% 30%, #6fcf97, #1f8b4c);
            animation: blinkLight 3.2s ease-in-out infinite 1.2s;
            box-shadow: 0 0 24px rgba(0, 200, 100, 0.25);
        }

        @keyframes blinkLight {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.85);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* 标题 — 纯文本，无表情 */
        .main-title {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ffffff 0%, #9ac8ff 30%, #d4bfff 60%, #ffffff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 24px rgba(60, 120, 255, 0.15));
            animation: titleShine 8s ease-in-out infinite alternate;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        @keyframes titleShine {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        /* 副标题 — 英文或辅助文字 */
        .sub-title {
            font-size: 14px;
            letter-spacing: 10px;
            color: rgba(180, 215, 255, 0.45);
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 28px;
            font-family: "Helvetica Neue", Arial, sans-serif;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
        }

        /* 装饰分隔 */
        .divider {
            width: 70px;
            height: 2px;
            margin: 0 auto 28px;
            background: linear-gradient(90deg, transparent, rgba(100, 180, 255, 0.30), rgba(180, 140, 255, 0.30), transparent);
            border-radius: 2px;
            position: relative;
        }
        .divider::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15), transparent);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* 描述 */
        .description {
            font-size: 16px;
            color: rgba(200, 225, 255, 0.55);
            line-height: 1.8;
            font-weight: 300;
            max-width: 340px;
            margin: 0 auto 34px;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
        }

        /* ===== 按钮 ===== */
        .btn-start {
            position: relative;
            display: inline-block;
            padding: 18px 56px;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 60px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.20);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 64px;
            min-width: 200px;
            overflow: hidden;
        }

        /* 按钮高光层 */
        .btn-start::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 12%;
            width: 76%;
            height: 35%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.4s;
        }

        .btn-start::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 62px;
            background: linear-gradient(135deg, rgba(100, 180, 255, 0.15), rgba(180, 130, 255, 0.10));
            z-index: -1;
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.6s;
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.30);
            box-shadow:
                0 16px 60px rgba(60, 120, 255, 0.20),
                0 8px 28px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .btn-start:hover::after {
            opacity: 1;
        }
        .btn-start:hover::before {
            opacity: 0.8;
        }

        .btn-start:active {
            transform: translateY(1px) scale(0.97);
            background: rgba(255, 255, 255, 0.02);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.30);
            transition-duration: 0.08s;
        }

        /* 箭头动画 */
        .btn-start .arrow {
            display: inline-block;
            margin-left: 12px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-start:hover .arrow {
            transform: translateX(8px) scale(1.1);
        }

        /* 脉冲环 */
        .btn-start .pulse-ring {
            position: absolute;
            inset: -5px;
            border-radius: 64px;
            border: 1.5px solid rgba(100, 200, 255, 0.08);
            animation: btnPulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes btnPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.06);
                opacity: 0.7;
            }
        }

        /* ===== 版本信息 ===== */
        .version-info {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(180, 210, 255, 0.20);
            letter-spacing: 2px;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .version-info .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(180, 210, 255, 0.15);
            display: inline-block;
        }

        /* ===== 响应式 ===== */

        /* 平板 & 小屏笔记本 */
        @media (max-width: 768px) {
            .main-container {
                max-width: 480px;
                padding: 16px;
            }
            .glass-card {
                padding: 36px 28px 30px;
                border-radius: 32px;
            }
            .main-title {
                font-size: 36px;
                letter-spacing: 4px;
            }
            .sub-title {
                font-size: 12px;
                letter-spacing: 8px;
            }
            .btn-start {
                padding: 16px 44px;
                font-size: 18px;
                min-height: 56px;
                min-width: 170px;
            }
            .description {
                font-size: 15px;
                max-width: 300px;
            }
        }

        /* 手机 */
        @media (max-width: 480px) {
            .main-container {
                padding: 12px;
                max-width: 100%;
            }
            .glass-card {
                padding: 28px 20px 24px;
                border-radius: 28px;
                border-width: 1px;
                box-shadow:
                    0 24px 60px rgba(0, 0, 0, 0.50),
                    0 4px 20px rgba(0, 0, 0, 0.25),
                    inset 0 1px 0 rgba(255, 255, 255, 0.15);
                animation: none; /* 手机去掉浮动，更稳定 */
            }
            .glass-card::before {
                left: 20%;
                width: 60%;
                height: 2px;
            }
            .glass-card::after {
                top: 4px;
                left: 6px;
                right: 6px;
                height: 25%;
            }
            .side-highlight {
                display: none;
            }

            .main-title {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .sub-title {
                font-size: 10px;
                letter-spacing: 6px;
                margin-bottom: 20px;
            }
            .signal-lights {
                gap: 10px;
                margin-bottom: 14px;
            }
            .signal-light {
                width: 10px;
                height: 10px;
            }
            .divider {
                width: 50px;
                margin-bottom: 20px;
            }
            .description {
                font-size: 14px;
                max-width: 260px;
                margin-bottom: 26px;
                line-height: 1.6;
            }
            .btn-start {
                padding: 14px 36px;
                font-size: 16px;
                min-height: 50px;
                min-width: 150px;
                letter-spacing: 2px;
                border-radius: 50px;
            }
            .btn-start .arrow {
                margin-left: 8px;
            }
            .btn-start .pulse-ring {
                display: none;
            }
            .version-info {
                font-size: 10px;
                margin-top: 24px;
                gap: 12px;
            }
            .version-info .dot {
                width: 2px;
                height: 2px;
            }
            /* 隐藏背景粒子 */
            .particles {
                display: none;
            }
            .bg-glow {
                filter: blur(70px);
            }
            .bg-glow.g1 {
                width: 90vw;
                height: 90vw;
                top: -30%;
                left: -30%;
            }
            .bg-glow.g2 {
                width: 80vw;
                height: 80vw;
                bottom: -30%;
                right: -20%;
            }
        }

        /* 横屏手机 */
        @media (max-height: 500px) and (orientation: landscape) {
            .main-container {
                min-height: 100vh;
                padding: 10px 20px;
                max-width: 500px;
            }
            .glass-card {
                padding: 20px 24px 18px;
                border-radius: 24px;
                max-width: 480px;
                animation: none;
            }
            .glass-card::before,
            .glass-card::after {
                display: none;
            }
            .side-highlight {
                display: none;
            }
            .main-title {
                font-size: 24px;
                letter-spacing: 2px;
            }
            .sub-title {
                font-size: 10px;
                margin-bottom: 12px;
                letter-spacing: 5px;
            }
            .signal-lights {
                gap: 8px;
                margin-bottom: 10px;
            }
            .signal-light {
                width: 8px;
                height: 8px;
            }
            .divider {
                width: 40px;
                margin: 0 auto 14px;
            }
            .description {
                font-size: 12px;
                margin-bottom: 18px;
                max-width: 220px;
            }
            .btn-start {
                padding: 12px 30px;
                font-size: 14px;
                min-height: 42px;
                min-width: 130px;
            }
            .version-info {
                margin-top: 16px;
                font-size: 9px;
            }
            .particles {
                display: none;
            }
            .bg-glow {
                display: none;
            }
        }

        /* 超大屏 */
        @media (min-width: 1200px) {
            .main-container {
                max-width: 700px;
            }
            .glass-card {
                padding: 56px 48px 46px;
                border-radius: 48px;
            }
            .main-title {
                font-size: 52px;
                letter-spacing: 8px;
            }
            .sub-title {
                font-size: 16px;
                letter-spacing: 14px;
            }
            .btn-start {
                padding: 22px 72px;
                font-size: 22px;
                min-height: 72px;
                min-width: 240px;
            }
            .description {
                font-size: 18px;
                max-width: 400px;
            }
        }

        /* 辅助类 */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }

        /* 按钮点击波纹 */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.20);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 背景 ===== -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-glow g1"></div>
        <div class="bg-glow g2"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="main-container">
        <div class="glass-card" role="main" aria-label="游戏开始封面">

            <div class="side-highlight"></div>

            <div class="card-content">

                <!-- 信号灯 -->
                <div class="signal-lights" aria-hidden="true">
                    <span class="signal-light s1"></span>
                    <span class="signal-light s2"></span>
                    <span class="signal-light s3"></span>
                </div>

                <!-- 主标题 -->
                <h1 class="main-title">欢迎游玩作者Lux的游戏</h1>

                <!-- 副标题 -->
                <div class="sub-title">动车组接线员</div>

                <!-- 分隔 -->
                <div class="divider" aria-hidden="true"></div>

                <!-- 描述 -->
                <p class="description">
                    调度列车 · 指挥线路 · 保障安全
                </p>

                <!-- 开始按钮 -->
                <button class="btn-start" id="btnStart" aria-label="开始游戏">
                    <span class="pulse-ring"></span>
                    开始游戏
                    <span class="arrow">→</span>
                </button>

                <!-- 版本信息 -->
                <div class="version-info">
                    <span>v1.0.0</span>
                    <span class="dot"></span>
                    <span>模拟铁路</span>
                    <span class="dot"></span>
                    <span>2026</span>
                </div>

            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const btn = document.getElementById('btnStart');

            // ===== 按钮点击 =====
            btn.addEventListener('click', function(e) {
                // 波纹
                const rect = btn.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height) * 0.6;
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;

                const ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                btn.appendChild(ripple);

                setTimeout(() => {
                    if (ripple.parentNode) ripple.remove();
                }, 700);

                // 按钮反馈
                const originalText = btn.innerHTML;
                btn.innerHTML = '⏳ 启动中…';
                btn.disabled = true;
                btn.style.opacity = '0.8';

                // 模拟加载
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    showPrompt('🚄 动车组接线员', '游戏引擎加载中…\n列车已就绪，即将发车！');
                }, 1200);
            });

            // ===== 自定义提示 =====
            function showPrompt(title, message) {
                const old = document.querySelector('.game-prompt-overlay');
                if (old) old.remove();

                const overlay = document.createElement('div');
                overlay.className = 'game-prompt-overlay';
                overlay.style.cssText = `
                            position: fixed;
                            top: 0;
                            left: 0;
                            width: 100%;
                            height: 100%;
                            z-index: 9999;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            background: rgba(0,0,0,0.50);
                            backdrop-filter: blur(14px);
                            -webkit-backdrop-filter: blur(14px);
                            animation: fadeIn 0.3s ease;
                            padding: 20px;
                        `;

                const box = document.createElement('div');
                box.style.cssText = `
                            max-width: 420px;
                            width: 100%;
                            background: rgba(255,255,255,0.05);
                            backdrop-filter: blur(24px);
                            -webkit-backdrop-filter: blur(24px);
                            border: 1px solid rgba(255,255,255,0.10);
                            border-radius: 32px;
                            padding: 40px 32px 34px;
                            text-align: center;
                            box-shadow: 0 40px 100px rgba(0,0,0,0.50);
                            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                        `;

                box.innerHTML = `
                            <div style="font-size:48px;margin-bottom:8px;line-height:1;">🚄</div>
                            <h2 style="font-size:24px;font-weight:600;color:#fff;margin-bottom:8px;letter-spacing:2px;">${title}</h2>
                            <p style="font-size:16px;color:rgba(200,225,255,0.70);line-height:1.8;margin-bottom:28px;white-space:pre-line;">${message}</p>
                            <button id="promptCloseBtn" style="
                                padding:14px 44px;
                                font-size:16px;
                                font-weight:500;
                                color:#fff;
                                background:rgba(255,255,255,0.06);
                                backdrop-filter:blur(8px);
                                -webkit-backdrop-filter:blur(8px);
                                border:1px solid rgba(255,255,255,0.15);
                                border-radius:60px;
                                cursor:pointer;
                                transition:all 0.3s;
                                letter-spacing:2px;
                                box-shadow:0 8px 24px rgba(0,0,0,0.20);
                            ">我知道了</button>
                        `;

                overlay.appendChild(box);
                document.body.appendChild(overlay);

                // 动态样式
                const style = document.createElement('style');
                style.textContent = `
                            @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
                            @keyframes slideUp { from { opacity:0; transform: translateY(30px) scale(0.96); } to { opacity:1; transform: translateY(0) scale(1); } }
                            #promptCloseBtn:hover {
                                background: rgba(255,255,255,0.12);
                                border-color: rgba(255,255,255,0.30);
                                transform: scale(1.02);
                            }
                            #promptCloseBtn:active { transform: scale(0.97); }
                            @media (max-width:480px) {
                                .game-prompt-overlay { padding:12px; }
                                .game-prompt-overlay div { padding:28px 18px 24px; border-radius:24px; }
                                .game-prompt-overlay h2 { font-size:20px; }
                                .game-prompt-overlay p { font-size:14px; }
                                .game-prompt-overlay button { padding:12px 32px; font-size:14px; }
                            }
                        `;
                document.head.appendChild(style);

                const closeBtn = box.querySelector('#promptCloseBtn');
                const close = () => {
                    overlay.remove();
                    style.remove();
                    document.removeEventListener('keydown', escHandler);
                };
                closeBtn.addEventListener('click', close);
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) close();
                });

                const escHandler = function(e) {
                    if (e.key === 'Escape') close();
                };
                document.addEventListener('keydown', escHandler);
            }

            // ===== 键盘快捷键 =====
            document.addEventListener('keydown', function(e) {
                if ((e.key === 'Enter' || e.key === ' ') && (document.activeElement === btn || document.activeElement === document.body)) {
                    e.preventDefault();
                    btn.click();
                }
            });

            console.log('🚄 动车组接线员 · 开始封面已加载 (Lux版)');
        })();
    </script>

</body>
</html>
