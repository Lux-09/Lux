<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>货运安全管控中心 - 主控台</title>
    <style>
        /* ============ 全局重置 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Courier New", "Consolas", "Monaco", "PingFang SC", "Microsoft YaHei", monospace;
            background-color: #0a0e14;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ 背景图片容器（您粘贴的图片HTML代码将放在这里） ============ */
        .bg-layer-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none; /* 让点击穿透到下面的内容 */
        }

        /* 强制容器内的任何图片或SVG铺满整个屏幕 */
        .bg-layer-container img,
        .bg-layer-container svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 叠加暗色蒙版 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: rgba(4, 8, 15, 0.45);
            pointer-events: none;
        }

        /* 扫描线效果 */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(0, 0, 0, 0.03) 4px);
        }

        /* 噪点纹理 */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0.018;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        @media (max-width: 768px) {
            .bg-overlay {
                background: rgba(4, 8, 15, 0.52);
            }
        }
        @media (max-width: 380px) {
            .bg-overlay {
                background: rgba(4, 8, 15, 0.58);
            }
        }

        /* ============ 主界面容器 ============ */
        .main-container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============ 顶部状态栏 ============ */
        .top-status {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 22px;
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #b8d8e8;
            text-shadow: 0 0 8px rgba(100, 180, 220, 0.5);
            z-index: 20;
            pointer-events: none;
        }

        .top-status .sys-name {
            font-weight: bold;
            color: #7dd3e8;
            font-size: 13px;
            letter-spacing: 2px;
            opacity: 0.9;
        }

        .top-status .sys-time {
            font-variant-numeric: tabular-nums;
            font-size: 13px;
            opacity: 0.75;
            letter-spacing: 1px;
        }

        .indicator-dots {
            display: flex;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .indicator-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #44dd88;
            box-shadow: 0 0 6px #44dd88;
            animation: pulse-dot 2.2s ease-in-out infinite;
        }
        .indicator-dots .dot.amber {
            background: #ffaa33;
            box-shadow: 0 0 6px #ffaa33;
            animation-delay: 1.1s;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        /* ============ 中央核心区 ============ */
        .core-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            text-align: center;
            max-width: 680px;
            width: 100%;
            transform: translateY(-2vh);
        }

        .title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .game-main-title {
            font-size: clamp(28px, 6vw, 54px);
            font-weight: 700;
            letter-spacing: 6px;
            color: #e8f4fa;
            text-shadow:
                0 0 16px rgba(120, 200, 240, 0.7),
                0 0 40px rgba(80, 160, 200, 0.4),
                0 2px 4px rgba(0, 0, 0, 0.6);
            line-height: 1.15;
            text-transform: uppercase;
        }

        .game-sub-title {
            font-size: clamp(11px, 2vw, 15px);
            letter-spacing: 8px;
            color: #9cc8dc;
            text-shadow: 0 0 10px rgba(100, 180, 220, 0.5);
            text-transform: uppercase;
            opacity: 0.8;
            margin-top: 4px;
        }

        .divider-line {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 80%;
            max-width: 420px;
            margin: 4px 0 6px;
        }
        .divider-line .line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(140, 200, 230, 0.5), transparent);
        }
        .divider-line .diamond {
            width: 8px;
            height: 8px;
            background: #7dd3e8;
            transform: rotate(45deg);
            box-shadow: 0 0 10px #7dd3e8;
            flex-shrink: 0;
        }

        .version-tag {
            font-size: 10px;
            letter-spacing: 3px;
            color: #6a8fa0;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* ============ 按钮区域 ============ */
        .button-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-top: 18px;
            width: 100%;
        }

        .btn-start {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 52px;
            font-family: inherit;
            font-size: clamp(16px, 2.5vw, 20px);
            font-weight: 600;
            letter-spacing: 4px;
            color: #d8ecf4;
            background: rgba(10, 20, 30, 0.55);
            border: 1.5px solid rgba(120, 190, 220, 0.6);
            border-radius: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.25s ease;
            text-shadow: 0 0 8px rgba(150, 210, 240, 0.6);
            box-shadow:
                0 0 20px rgba(80, 160, 200, 0.2),
                inset 0 0 18px rgba(80, 160, 200, 0.08);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            background-clip: padding-box;
        }

        .btn-start:hover {
            background: rgba(15, 30, 42, 0.7);
            border-color: rgba(150, 220, 250, 0.85);
            box-shadow:
                0 0 32px rgba(100, 190, 230, 0.4),
                inset 0 0 24px rgba(100, 190, 230, 0.12);
            color: #f0f8fc;
            transform: translateY(-1px);
        }

        .btn-start:active {
            transform: translateY(1px);
            box-shadow:
                0 0 14px rgba(80, 160, 200, 0.3),
                inset 0 0 20px rgba(80, 160, 200, 0.15);
            background: rgba(8, 16, 24, 0.8);
        }

        .btn-start:focus-visible {
            border-color: rgba(160, 225, 255, 0.9);
            box-shadow:
                0 0 24px rgba(100, 190, 230, 0.5),
                inset 0 0 20px rgba(100, 190, 230, 0.1);
        }

        .btn-start::after {
            content: "▮";
            font-size: 14px;
            opacity: 0.7;
            animation: blink-cursor 1.1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0; }
        }

        .btn-secondary {
            padding: 8px 26px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 3px;
            color: #7a9dad;
            background: transparent;
            border: 1px solid rgba(110, 150, 170, 0.35);
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.22s ease;
            text-transform: uppercase;
            opacity: 0.7;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .btn-secondary:hover {
            opacity: 1;
            border-color: rgba(140, 190, 215, 0.7);
            color: #b8dce8;
            background: rgba(10, 20, 30, 0.35);
        }
        .btn-secondary:focus-visible {
            border-color: rgba(150, 210, 240, 0.8);
            opacity: 1;
        }

        .hint-text {
            font-size: 9.5px;
            letter-spacing: 2px;
            color: #56788a;
            opacity: 0.55;
            margin-top: 6px;
            text-align: center;
            line-height: 1.6;
            pointer-events: none;
        }

        /* ============ 底部角落装饰 ============ */
        .corner-decor {
            position: absolute;
            z-index: 15;
            pointer-events: none;
            opacity: 0.45;
            font-size: 10px;
            letter-spacing: 2px;
            color: #6a9aa8;
        }
        .corner-decor.bottom-left {
            bottom: 16px;
            left: 20px;
            text-align: left;
            line-height: 1.7;
        }
        .corner-decor.bottom-right {
            bottom: 16px;
            right: 20px;
            text-align: right;
            line-height: 1.7;
        }

        .corner-frame {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
        }
        .corner-frame.tl {
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid rgba(130, 190, 220, 0.7);
            border-left: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.tr {
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid rgba(130, 190, 220, 0.7);
            border-right: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.bl {
            bottom: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid rgba(130, 190, 220, 0.7);
            border-left: 2px solid rgba(130, 190, 220, 0.7);
        }
        .corner-frame.br {
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid rgba(130, 190, 220, 0.7);
            border-right: 2px solid rgba(130, 190, 220, 0.7);
        }

        /* ============ 响应式微调 ============ */
        @media (max-width: 768px) {
            .top-status {
                padding: 10px 14px;
                font-size: 10px;
                letter-spacing: 1px;
            }
            .top-status .sys-name {
                font-size: 11px;
                letter-spacing: 1.5px;
            }
            .top-status .sys-time {
                font-size: 11px;
            }
            .core-area {
                gap: 16px;
                transform: translateY(-1vh);
            }
            .game-main-title {
                letter-spacing: 3px;
            }
            .game-sub-title {
                letter-spacing: 4px;
            }
            .btn-start {
                padding: 14px 38px;
                font-size: 15px;
                letter-spacing: 3px;
            }
            .divider-line {
                width: 88%;
                max-width: 320px;
            }
            .corner-decor {
                font-size: 8px;
                letter-spacing: 1px;
            }
            .corner-decor.bottom-left {
                bottom: 10px;
                left: 12px;
            }
            .corner-decor.bottom-right {
                bottom: 10px;
                right: 12px;
            }
            .corner-frame.tl, .corner-frame.tr,
            .corner-frame.bl, .corner-frame.br {
                width: 20px;
                height: 20px;
            }
            .corner-frame.tl { top: 6px; left: 6px; }
            .corner-frame.tr { top: 6px; right: 6px; }
            .corner-frame.bl { bottom: 6px; left: 6px; }
            .corner-frame.br { bottom: 6px; right: 6px; }
        }

        @media (max-width: 768px) and (orientation: landscape) {
            .main-container {
                padding: 10px;
            }
            .core-area {
                gap: 10px;
                transform: translateY(0);
            }
            .game-main-title {
                font-size: clamp(20px, 4.5vw, 30px);
                letter-spacing: 3px;
            }
            .btn-start {
                padding: 10px 28px;
                font-size: 13px;
            }
            .game-sub-title {
                font-size: 10px;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

                <span class="dot" aria-hidden="true"></span>
                <span class="dot amber" aria-hidden="true"></span>
                <span class="sys-name">FSCS · 主控中心</span>
            </div>
            <span class="sys-time" id="sysTime">--:--:--</span>
        </div>

        <!-- 中央核心区 -->
        <div class="core-area">
            <div class="title-block">
                <h1 class="game-main-title">货运安全管控</h1>
                <p class="game-sub-title">Freight Security Command</p>
            </div>

            <div class="divider-line">
                <span class="line"></span>
                <span class="diamond"></span>
                <span class="line"></span>
            </div>

            <span class="version-tag">v0.1.0 &nbsp;|&nbsp; BUILD 2024.11</span>

            <div class="button-area">
                <button class="btn-start" id="btnStart" type="button">开始游戏</button>
                <button class="btn-secondary" id="btnSettings" type="button">系统设置</button>
            </div>

            <p class="hint-text">
                &gt; 链路检测中 ... 所有货柜监控节点在线 &lt;<br>
                &gt; 按 [ENTER] 快速进入指挥台 &lt;
            </p>
        </div>

        <div class="corner-decor bottom-left" aria-hidden="true">
            节点: CQ-07 &nbsp;|&nbsp; 线路: 渝新欧<br>
            延迟: 12ms &nbsp;|&nbsp; 加密: AES-256
        </div>
        <div class="corner-decor bottom-right" aria-hidden="true">
            FSCS 安全管控系统<br>
            © 2024 货运安保部
        </div>

    </div>

    <script>
        (function() {
            // ============ 实时时钟 ============
            function updateClock() {
                var el = document.getElementById('sysTime');
                if (!el) return;
                var now = new Date();
                var hh = String(now.getHours()).padStart(2, '0');
                var mm = String(now.getMinutes()).padStart(2, '0');
                var ss = String(now.getSeconds()).padStart(2, '0');
                el.textContent = hh + ':' + mm + ':' + ss + ' CST';
            }
            updateClock();
            setInterval(updateClock, 1000);

            // ============ 背景容器切换（桌面/手机） ============
            var bgDesktopContainer = document.getElementById('bgDesktopContainer');
            var bgMobileContainer = document.getElementById('bgMobileContainer');

            function switchBackground() {
                var isMobile = window.innerWidth <= 768;
                if (bgDesktopContainer && bgMobileContainer) {
                    if (isMobile) {
                        bgDesktopContainer.style.display = 'none';
                        bgMobileContainer.style.display = 'block';
                    } else {
                        bgDesktopContainer.style.display = 'block';
                        bgMobileContainer.style.display = 'none';
                    }
                }
            }

            switchBackground();
            window.addEventListener('resize', switchBackground);

            // ============ 按钮交互 ============
            var btnStart = document.getElementById('btnStart');
            var btnSettings = document.getElementById('btnSettings');

            if (btnStart) {
                btnStart.addEventListener('click', function(e) {
                    btnStart.style.transform = 'translateY(1px)';
                    setTimeout(function() {
                        btnStart.style.transform = '';
                    }, 120);
                    showBootMessage('正在连接主控网络 ... 请稍候');
                });
            }

            if (btnSettings) {
                btnSettings.addEventListener('click', function(e) {
                    btnSettings.style.transform = 'translateY(1px)';
                    setTimeout(function() {
                        btnSettings.style.transform = '';
                    }, 100);
                    showBootMessage('设置面板暂未开放 · 敬请期待');
                });
            }

            // ============ 键盘快捷键 ============
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.keyCode === 13) {
                    if (btnStart) {
                        btnStart.click();
                    }
                    e.preventDefault();
                }
                if (e.key === 's' || e.key === 'S') {
                    if (btnSettings) {
                        btnSettings.click();
                    }
                    e.preventDefault();
                }
            });

            // ============ 简单消息提示 ============
            function showBootMessage(msg) {
                var hintEl = document.querySelector('.hint-text');
                if (!hintEl) return;
                var originalText = hintEl.innerHTML;
                hintEl.textContent = '> ' + msg + ' <';
                hintEl.style.opacity = '0.9';
                hintEl.style.color = '#a8ccd8';

                clearTimeout(hintEl._msgTimer);
                hintEl._msgTimer = setTimeout(function() {
                    hintEl.innerHTML = originalText;
                    hintEl.style.opacity = '';
                    hintEl.style.color = '';
                }, 3500);
            }

            // ============ 防止移动端双击缩放干扰 ============
            document.addEventListener('dblclick', function(e) {
                if (window.innerWidth <= 768) {
                    e.preventDefault();
                }
            }, { passive: false });

        })();
    </script>
</body>
</html>
