<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>动车组接线员 - 调度终端</title>
    <style>
        /* CSS 重置与基础设置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
        }

        /* 背景：模拟动车段/调度大厅未来科技感背景 */
        #app-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 100, 0, 0.1) 0%, transparent 40%),
                linear-gradient(135deg, #070a13 0%, #111827 100%);
            z-index: 1;
        }

        /* 轨道光效装饰线 */
        .track-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.3), transparent);
            height: 1px;
            width: 100%;
            z-index: 2;
        }
        .track-line:nth-child(1) { top: 20%; animation: scan 8s linear infinite; }
        .track-line:nth-child(2) { top: 70%; animation: scan 12s linear infinite reverse; }

        @keyframes scan {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 全屏容器：电脑与手机统一强制全屏占满 */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
        }

        /* 固态高光拟真玻璃 UI 核心样式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.25); /* 顶部高光 */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        /* 头部：游戏标题区 */
        header {
            text-align: center;
            margin-top: 2vh;
        }

        .game-subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: #00f2fe;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .game-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(0,0,0,0.5);
        }

        /* 中部：动态或核心状态显示玻璃窗 */
        .center-display {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 8px;
        }

        .status-value {
            color: #38bdf8;
            font-family: monospace;
            font-weight: bold;
        }

        /* 底部：操作菜单与按钮区 */
        .menu-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 1vh;
        }

        .glass-btn {
            position: relative;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }

        /* 按钮高光扫过效果 */
        .glass-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .glass-btn:hover::after {
            left: 100%;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
            border-color: rgba(0, 242, 254, 0.4);
        }

        /* 作者与联系按钮栏 */
        .footer-info {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 1vh;
        }

        .author-text {
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .contact-link-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .contact-link-btn:hover {
            color: #00f2fe;
        }

        /* 游戏内玻璃拟态弹窗遮罩 */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            width: 90%;
            max-width: 380px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #00f2fe;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .modal-body {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
            word-break: break-all;
        }

        .modal-close-btn {
            margin-top: 8px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- 背景装饰 -->
    <div id="app-background">
        <div class="track-line"></div>
        <div class="track-line"></div>
    </div>

    <!-- 游戏主视口 (强制全屏) -->
    <div id="game-container">
        
        <!-- 标题区 -->
        <header>
            <div class="game-subtitle">CRH Dispatcher System</div>
            <h1 class="game-title">动车组接线员</h1>
        </header>

        <!-- 中部状态与区段显示玻璃面板 -->
        <div class="glass-panel center-display">
            <div class="status-item">
                <span>系统状态</span>
                <span class="status-value" id="sys-status">🟢 内部测试就绪</span>
            </div>
            <div class="status-item">
                <span>调度区段</span>
                <span class="status-value" id="ip-dispatch-area">正在定位最近铁路线...</span>
            </div>
            <div class="status-item">
                <span>当前版本</span>
                <span class="status-value">内部测试版01</span>
            </div>
        </div>

        <!-- 底部菜单与交互按钮 -->
        <div class="menu-container">
            <button class="glass-btn btn-primary" onclick="startGame()">开始接车</button>
            <button class="glass-btn" onclick="openUpdates()">更新日志</button>
        </div>

        <!-- 作者与联系区 -->
        <div class="footer-info">
            <div class="author-text">Lux作者制作</div>
            <button class="contact-link-btn" onclick="openContact()">QQ邮箱联系</button>
        </div>

    </div>

    <!-- 游戏内统一毛玻璃弹窗 -->
    <div id="modal-overlay" onclick="closeModal(event)">
        <div class="modal-box glass-panel" onclick="event.stopPropagation()">
            <div class="modal-title" id="modal-title">提示</div>
            <div class="modal-body" id="modal-content">弹窗内容...</div>
            <button class="modal-close-btn" onclick="closeModalDirect()">确定</button>
        </div>
    </div>

    <script>
        // 1. IP 智能匹配铁路线逻辑
        async function initIPDispatcher() {
            const areaEl = document.getElementById('ip-dispatch-area');
            try {
                // 调用免费 IP 地理位置接口获取用户所在城市/省份
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                const city = data.city || '';
                const region = data.region || '';
                const country = data.country_name || '';

                // 根据地理位置智能匹配最近铁路/高铁干线
                let matchedArea = "京沪高铁 - 华东调度枢纽"; // 默认回退
                
                if (country !== 'China' && country !== 'CN') {
                    matchedArea = "国际联运线 - 边境调度中心";
                } else if (region.includes('广东') || region.includes('深圳') || region.includes('广州') || city.includes('广州') || city.includes('深圳')) {
                    matchedArea = "京广/广深港高铁 - 华南枢纽";
                } else if (region.includes('四川') || region.includes('重庆') || city.includes('成都') || city.includes('重庆')) {
                    matchedArea = "成渝客专 - 西南调度中心";
                } else if (region.includes('浙江') || region.includes('江苏') || region.includes('上海') || city.includes('上海') || city.includes('杭州')) {
                    matchedArea = "沪昆/京沪线 - 长三角枢纽";
                } else if (region.includes('陕西') || region.includes('甘肃') || region.includes('西安')) {
                    matchedArea = "徐兰客专 - 西北调度中心";
                } else if (region.includes('湖北') || city.includes('武汉')) {
                    matchedArea = "京广高铁 - 武汉核心枢纽";
                } else if (region.includes('北京') || region.includes('天津') || region.includes('河北')) {
                    matchedArea = "京津冀城际 - 北京调度中心";
                }

                areaEl.innerText = matchedArea;
            } catch (e) {
                // 如果定位失败（如无网络或受防火墙限制），显示默认调度区段
                areaEl.innerText = "京沪高铁 - 03号核心枢纽";
            }
        }

        // 初始化时运行 IP 定位
        initIPDispatcher();

        // 2. 弹窗控制函数
        function showModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModalDirect() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function closeModal(e) {
            if (e.target.id === 'modal-overlay') {
                closeModalDirect();
            }
        }

        // 3. 按钮交互响应
        function startGame() {
            showModal("提示", "【开始接车】核心玩法正在加紧开发中，请期待后续版本更新！");
        }

        function openUpdates() {
            showModal("更新日志 (内部测试版01)", 
                "• <b>版本号</b>：更新为内部测试版01。<br>" +
                "• <b>IP智能调度</b>：已接入基于IP地址的铁路干线自动适配。<br>" +
                "• <b>UI升级</b>：将所有弹窗全面改写为游戏内拟真玻璃模态框。<br>" +
                "• <b>版权归属</b>：标明 Lux作者制作与联系通道。"
            );
        }

        function openContact() {
            showModal("联系作者", 
                "如果您在测试过程中遇到任何问题或Bug，欢迎通过QQ邮箱与我联系：<br><br>" +
                "<b style='color:#00f2fe; font-size:1.05rem;'>2210380754@qq.com</b><br><br>" +
                "<span style='color:#f87171; font-size:0.85rem;'>⚠️ 反馈请备注游戏反馈</span>"
            );
        }
    </script>
</body>
</html>
