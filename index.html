<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反导小工厂</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f0f2f5; color: #333; height: 100vh; display: flex; justify-content: center; align-items: center; }

        /* 开始界面 */
        #start-screen {
            text-align: center;
            background: #fff;
            padding: 50px 80px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        #start-screen h1 { font-size: 3rem; color: #000; margin-bottom: 16px; font-weight: 800; }
        #start-screen p { font-size: 1.1rem; color: #666; margin-bottom: 32px; }
        .btn-green {
            background: #2ea44f; color: #fff; border: none; font-size: 1.2rem;
            padding: 14px 40px; border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        .btn-green:hover { background: #2c974b; }

        /* 主界面 */
        #main-screen {
            display: none; width: 95vw; height: 90vh; background: #fff;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden;
        }
        .container { display: flex; width: 100%; height: 100%; }

        /* 左侧面板 30% */
        .left-panel {
            width: 30%; background: #f8f9fa; border-right: 1px solid #e1e4e8;
            padding: 24px; display: flex; flex-direction: column; gap: 20px;
        }
        .gold-box { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e1e4e8; text-align: center; }
        .gold-box h2 { font-size: 2rem; color: #d97706; margin-top: 4px; }
        .upgrade-btn {
            background: #2563eb; color: #fff; border: none; padding: 14px;
            border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer;
            text-align: left; transition: background 0.2s;
        }
        .upgrade-btn:hover { background: #1d4ed8; }
        .upgrade-btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .attr-desc { font-size: 0.85rem; color: #4b5563; margin-top: -12px; margin-bottom: 8px; padding-left: 4px; }

        /* 中间画布 50% */
        .center-panel { width: 50%; height: 100%; position: relative; background: #1e293b; display: flex; flex-direction: column; }
        canvas { width: 100%; height: 100%; display: block; }
        .status-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-size: 1.5rem; font-weight: bold; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* 右侧面板 20% */
        .right-panel {
            width: 20%; border-left: 1px solid #e1e4e8; padding: 20px;
            display: flex; flex-direction: column; gap: 16px; background: #fff;
        }
        .btn-red {
            background: #dc2626; color: #fff; border: none; padding: 16px;
            border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-red:hover { background: #b91c1c; }
        .btn-red:disabled { background: #9ca3af; cursor: not-allowed; }
        .log-box {
            flex: 1; border: 1px solid #e1e4e8; border-radius: 8px; padding: 12px;
            background: #f8f9fa; overflow-y: auto; font-size: 0.85rem; color: #374151;
            display: flex; flex-direction: column; gap: 8px;
        }
        .log-item { border-bottom: 1px dashed #d1d5db; padding-bottom: 4px; }

        /* 弹窗样式 */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #fff; padding: 32px; border-radius: 12px; max-width: 480px; width: 90%;
            text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin-bottom: 12px; font-size: 1.8rem; }
        .modal-content p { font-size: 1rem; color: #4b5563; margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>

    <!-- 1. 游戏开始界面 -->
    <div id="start-screen">
        <h1>反导小工厂</h1>
        <p>点一下按钮，你就能自己攒一套导弹防御系统</p>
        <button class="btn-green" onclick="startGame()">开始研发</button>
    </div>

    <!-- 2. 游戏主界面UI -->
    <div id="main-screen">
        <div class="container">
            <!-- 左边 30% -->
            <div class="left-panel">
                <div class="gold-box">
                    <span>当前研发金币</span>
                    <h2 id="gold-val">100</h2>
                </div>
                
                <button class="upgrade-btn" id="btn-radar" onclick="upgrade('radar')">点我升级雷达 (花费 10金币)</button>
                <div class="attr-desc" id="desc-radar">当前能探测到导弹的距离：100公里</div>

                <button class="upgrade-btn" id="btn-missile" onclick="upgrade('missile')">点我升级拦截弹 (花费 10金币)</button>
                <div class="attr-desc" id="desc-missile">当前拦截弹飞行速度：2.0马赫</div>

                <button class="upgrade-btn" id="btn-command" onclick="upgrade('command')">点我升级指挥系统 (花费 10金币)</button>
                <div class="attr-desc" id="desc-command">当前系统响应与追踪精度：50%</div>
            </div>

            <!-- 中间 50% -->
            <div class="center-panel">
                <div class="status-overlay" id="status-text"></div>
                <canvas id="sim-canvas"></canvas>
            </div>

            <!-- 右边 20% -->
            <div class="right-panel">
                <button class="btn-red" id="btn-test" onclick="startTest()">开始拦截测试 (<span id="round-val">0</span>/10)</button>
                <div style="font-size:0.9rem; font-weight:bold; color:#4b5563;">系统研发与测试日志:</div>
                <div class="log-box" id="log-box"></div>
            </div>
        </div>
    </div>

    <!-- 统一弹窗 -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modal-title">成就解锁！</h2>
            <p id="modal-body">内容文字</p>
            <button class="btn-green" id="modal-btn" onclick="closeModal()">收下勋章</button>
        </div>
    </div>

    <script>
        // 游戏数据状态
        let state = {
            gold: 100,
            spentGold: 0,
            radarLvl: 1,
            missileLvl: 1,
            commandLvl: 1,
            round: 0,
            wins: 0,
            consecutiveWins: 0,
            awarded3: false,
            awarded5: false,
            testing: false
        };

        const canvas = document.getElementById('sim-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawStaticScene();
        }
        window.addEventListener('resize', resizeCanvas);

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'block';
            resizeCanvas();
            addLog("系统初始化完成。获得初始研发金币 100。");
        }

        function addLog(msg) {
            const logBox = document.getElementById('log-box');
            const timeStr = new Date().toTimeString().split(' ')[0];
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerText = `[${timeStr}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateUI() {
            document.getElementById('gold-val').innerText = state.gold;
            document.getElementById('round-val').innerText = state.round;
            
            // 属性数字
            document.getElementById('desc-radar').innerText = `当前能探测到导弹的距离：${100 + (state.radarLvl - 1) * 50}公里`;
            document.getElementById('desc-missile').innerText = `当前拦截弹飞行速度：${(2.0 + (state.missileLvl - 1) * 0.8).toFixed(1)}马赫`;
            document.getElementById('desc-command').innerText = `当前系统响应与追踪精度：${Math.min(99, 50 + (state.commandLvl - 1) * 8)}%`;

            // 按钮禁用状态
            const canAfford = state.gold >= 10 && !state.testing && state.round < 10;
            document.getElementById('btn-radar').disabled = !canAfford;
            document.getElementById('btn-missile').disabled = !canAfford;
            document.getElementById('btn-command').disabled = !canAfford;
            document.getElementById('btn-test').disabled = state.testing || state.round >= 10;
        }

        function upgrade(type) {
            if (state.gold < 10 || state.testing) return;
            state.gold -= 10;
            state.spentGold += 10;

            if (type === 'radar') {
                state.radarLvl++;
                addLog(`升级雷达系统！当前范围达 ${100 + (state.radarLvl - 1) * 50} 公里。`);
            } else if (type === 'missile') {
                state.missileLvl++;
                addLog(`升级拦截弹速度！当前提升至 ${(2.0 + (state.missileLvl - 1) * 0.8).toFixed(1)} 马赫。`);
            } else if (type === 'command') {
                state.commandLvl++;
                addLog(`升级指挥系统！当前精确度达 ${Math.min(99, 50 + (state.commandLvl - 1) * 8)}%。`);
            }
            updateUI();
        }

        function drawStaticScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // 绘制地面
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
            
            // 绘制发射基站 (左侧)
            ctx.fillStyle = '#10b981';
            ctx.fillRect(40, canvas.height - 50, 40, 20);
        }

        function startTest() {
            if (state.testing || state.round >= 10) return;
            
            state.testing = true;
            state.round++;
            updateUI();
            addLog(`>>> 第 ${state.round} 轮拦截测试开始！`);

            // 计算综合成功概率
            // 基础概率 25%，三项升级共同提升
            const successRate = Math.min(0.95, 0.25 + (state.radarLvl - 1) * 0.12 + (state.missileLvl - 1) * 0.10 + (state.commandLvl - 1) * 0.10);
            const isSuccess = Math.random() < successRate;

            // 运行 Canvas 拦截动画
            runAnimation(isSuccess);
        }

        function runAnimation(isSuccess) {
            let progress = 0;
            const statusText = document.getElementById('status-text');
            statusText.innerText = '警报：发现敌方入境导弹！';
            statusText.style.color = '#ef4444';

            const startX = canvas.width - 20;
            const startY = 40;
            const targetX = 60;
            const targetY = canvas.height - 40;

            // 撞击点（如果成功在空中，如果失败在地面）
            const hitX = isSuccess ? canvas.width * 0.4 : targetX;
            const hitY = isSuccess ? canvas.height * 0.4 : targetY;

            function animate() {
                progress += 0.015;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawStaticScene();

                // 敌方导弹位置
                const enemyCurrentX = startX + (hitX - startX) * Math.min(progress, 1);
                const enemyCurrentY = startY + (hitY - startY) * Math.min(progress, 1);

                // 绘制敌方导弹 (红点/矩形)
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(enemyCurrentX, enemyCurrentY, 6, 0, Math.PI * 2);
                ctx.fill();

                // 拦截弹位置 (起飞更晚一点)
                if (progress > 0.2) {
                    const intProgress = (progress - 0.2) / 0.8;
                    const intX = 60 + (hitX - 60) * Math.min(intProgress, 1);
                    const intY = (canvas.height - 50) + (hitY - (canvas.height - 50)) * Math.min(intProgress, 1);

                    // 绘制拦截弹 (绿小三角)
                    ctx.fillStyle = '#38bdf8';
                    ctx.beginPath();
                    ctx.moveTo(intX, intY - 8);
                    ctx.lineTo(intX - 6, intY + 6);
                    ctx.lineTo(intX + 6, intY + 6);
                    ctx.closePath();
                    ctx.fill();
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // 动画结束处理
                    if (isSuccess) {
                        // 爆炸效果
                        ctx.fillStyle = '#f59e0b';
                        ctx.beginPath();
                        ctx.arc(hitX, hitY, 25, 0, Math.PI * 2);
                        ctx.fill();

                        statusText.innerText = '拦截成功！';
                        statusText.style.color = '#10b981';
                        addLog(`第 ${state.round} 轮：拦截成功！防御网未受损。`);
                        state.wins++;
                        state.consecutiveWins++;
                    } else {
                        statusText.innerText = '拦截失败，导弹突防了！';
                        statusText.style.color = '#ef4444';
                        addLog(`第 ${state.round} 轮：拦截失败，敌方导弹突破防线！`);
                        state.consecutiveWins = 0;
                    }

                    state.testing = false;
                    updateUI();
                    checkBadges();

                    if (state.round >= 10) {
                        setTimeout(showFinalSummary, 1200);
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        function checkBadges() {
            if (state.consecutiveWins === 3 && !state.awarded3) {
                state.awarded3 = true;
                showModal("🎖️ 获得勋章：【新手反导工程师】", "恭喜你！连续成功拦截 3 次导弹！你已经初步掌握了用金币堆出防御系统的秘诀。");
            } else if (state.consecutiveWins === 5 && !state.awarded5) {
                state.awarded5 = true;
                showModal("🏆 获得勋章：【金牌反导大师】", "太强了！连续 5 次精准拦截！敌方导弹连你的裤脚都没碰到，军工界需要你这种硬核大佬！");
            }
        }

        function showModal(title, text, btnText = "收下勋章", callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerText = text;
            const btn = document.getElementById('modal-btn');
            btn.innerText = btnText;
            btn.onclick = () => {
                closeModal();
                if (callback) callback();
            };
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showFinalSummary() {
            const winRate = Math.round((state.wins / 10) * 100);
            const summaryText = `【测试总结报告】\n` +
                `• 10轮测试完成！总共消耗研发金币：${state.spentGold} 个\n` +
                `• 拦截成功率：${winRate}%\n\n` +
                `💡 科普时间：\n"你看，多砸钱升级雷达比乱砸钱升级导弹好使，真实的反导系统也是这个道理。"`;

            showModal("🏁 《反导小工厂》测试报告", summaryText, "重新开始研发", () => {
                location.reload();
            });
        }

        updateUI();
    </script>
</body>
</html>
